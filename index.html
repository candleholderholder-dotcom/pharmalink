<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone | منصة الطلاب الجامعيين</title>
    <!-- خط كايرو من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-navy-deep: #060b13;
            --bg-navy-surface: #0c1524;
            --bg-navy-card: #132035;
            --border-navy: #1f3352;
            --orange-neon: #ff6a00;
            --orange-neon-hover: #ff7f24;
            --orange-neon-glow: rgba(255, 106, 0, 0.35);
            --text-main: #f0f4f8;
            --text-muted: #8fa0b5;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-navy-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ===================================================
       1. شاشة البداية الترحيبية (Splash Screen)
       =================================================== */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0f1d33 0%, var(--bg-navy-deep) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo-container {
            text-align: center;
            animation: splashPulse 2s ease-in-out infinite;
        }

        .splash-logo-text {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: var(--text-main);
            line-height: 1;
        }

        .splash-logo-text span {
            color: var(--orange-neon);
            text-shadow: 0 0 25px var(--orange-neon-glow);
        }

        .splash-subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-top: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .splash-loader {
            margin-top: 35px;
            width: 48px;
            height: 4px;
            background: var(--border-navy);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .splash-loader::after {
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            height: 100%;
            width: 100%;
            background: var(--orange-neon);
            animation: loadBar 1.8s ease-in-out forwards;
        }

        @keyframes loadBar {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        @keyframes splashPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        /* ===================================================
       2. صفحة تسجيل الدخول والبيانات (Auth Screen)
       =================================================== */
        #auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #auth-screen.visible {
            opacity: 1;
        }

        .auth-card {
            background: var(--bg-navy-surface);
            border: 1px solid var(--border-navy);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--orange-neon), transparent);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-brand {
            font-size: 2.4rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 8px;
        }

        .auth-brand span {
            color: var(--orange-neon);
        }

        .auth-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-navy-deep);
            border: 1px solid var(--border-navy);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: var(--transition-smooth);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--orange-neon);
            box-shadow: 0 0 0 3px var(--orange-neon-glow);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn-primary {
            width: 100%;
            background: var(--orange-neon);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 18px var(--orange-neon-glow);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: var(--orange-neon-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(255, 106, 0, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* ===================================================
       3. السوق الطلابي (Student Market Screen)
       =================================================== */
        #market-screen {
            display: none;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 0.5s ease;
            flex-direction: column;
        }

        #market-screen.active {
            display: flex;
            opacity: 1;
        }

        /* الهيدر */
        .market-header {
            background: rgba(12, 21, 36, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-navy);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 24px;
        }

        .header-container {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: -1px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo span {
            color: var(--orange-neon);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .premium-badge-btn {
            background: linear-gradient(135deg, #ff6a00 0%, #d84315 100%);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            padding: 8px 18px;
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px var(--orange-neon-glow);
            transition: var(--transition-smooth);
        }

        .premium-badge-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.6);
        }

        .user-pill {
            background: var(--bg-navy-card);
            border: 1px solid var(--border-navy);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            display: none;
        }

        @media (min-width: 768px) {
            .user-pill {
                display: block;
            }
        }

        /* محتوى السوق */
        .market-content {
            flex: 1;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            padding: 32px 24px 60px;
        }

        .section-title-wrap {
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* شبكة المنتجات (Product Grid) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: var(--bg-navy-surface);
            border: 1px solid var(--border-navy);
            border-radius: var(--radius-md);
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--orange-neon);
            box-shadow: 0 12px 30px rgba(255, 106, 0, 0.15);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .item-category {
            background: rgba(255, 106, 0, 0.12);
            color: var(--orange-neon);
            border: 1px solid rgba(255, 106, 0, 0.3);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .item-location {
            color: var(--text-muted);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .item-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .item-faculty {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 18px;
        }

        .card-footer {
            border-top: 1px solid var(--border-navy);
            padding-top: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .item-price {
            display: flex;
            flex-direction: column;
        }

        .price-value {
            color: var(--orange-neon);
            font-size: 1.25rem;
            font-weight: 900;
            line-height: 1.2;
        }

        .price-unit {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .btn-contact {
            background: transparent;
            color: var(--orange-neon);
            border: 1px solid var(--orange-neon);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            white-space: nowrap;
        }

        .btn-contact:hover {
            background: var(--orange-neon);
            color: #fff;
            box-shadow: 0 0 14px var(--orange-neon-glow);
        }

        /* Modal صندوق التواصل والإشعار */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-navy-surface);
            border: 1px solid var(--border-navy);
            border-radius: var(--radius-md);
            padding: 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-box h3 {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .modal-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .btn-close {
            background: var(--orange-neon);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 1. شاشة البداية الترحيبية (Splash Screen) -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-logo-text">Z<span>one</span></div>
            <div class="splash-subtitle">المنصة الشاملة لطلاب الجامعات السورية</div>
            <div class="splash-loader"></div>
        </div>
    </div>

    <!-- 2. صفحة تسجيل الدخول وتعبئة البيانات (Auth Screen) -->
    <main id="auth-screen" style="display: none;">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-brand">Z<span>one</span></h1>
                <p class="auth-desc">يرجى تسجيل بياناتك الجامعية للمتابعة للسوق</p>
            </div>

            <form id="student-form">
                <div class="form-group">
                    <label for="student-name">الاسم الثلاثي</label>
                    <input type="text" id="student-name" class="form-control" placeholder="مثال: محمد يحيى" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="student-university">الجامعة</label>
                        <select id="student-university" class="form-control" required>
                            <option value="" disabled selected>اختر الجامعة</option>
                            <option value="جامعة دمشق">جامعة دمشق</option>
                            <option value="جامعة حلب">جامعة حلب</option>
                            <option value="جامعة تشرين">جامعة تشرين</option>
                            <option value="جامعة البعث">جامعة البعث</option>
                            <option value="جامعة طرطوس">جامعة طرطوس</option>
                            <option value="جامعة حماة">جامعة حماة</option>
                            <option value="جامعة افتراضية / خاصة">جامعة خاصة / افتراضية</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="student-faculty">الكلية / الفرع</label>
                        <input type="text" id="student-faculty" class="form-control"
                            placeholder="مثال: هندسة المعلوماتية" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="student-year">السنة الدراسية</label>
                        <select id="student-year" class="form-control" required>
                            <option value="السنة الأولى">السنة الأولى</option>
                            <option value="السنة الثانية">السنة الثانية</option>
                            <option value="السنة الثالثة">السنة الثالثة</option>
                            <option value="السنة الرابعة">السنة الرابعة</option>
                            <option value="السنة الخامسة">السنة الخامسة</option>
                            <option value="سنة التخرج / دراسات">سنة التخرج / دراسات</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="student-phone">رقم الموبايل</label>
                        <input type="tel" id="student-phone" class="form-control" placeholder="09xxxxxxxx" required
                            pattern="[0-9]{10}">
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <span>تسجيل الدخول</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <!-- 3. الصفحة الرئيسية لـ السوق الطلابي (Student Market) -->
    <div id="market-screen">
        <!-- الهيدر -->
        <header class="market-header">
            <div class="header-container">
                <a href="#" class="logo">Z<span>one</span></a>

                <div class="header-actions">
                    <div id="user-display-pill" class="user-pill">طالب مسجل</div>

                    <button class="premium-badge-btn" id="premium-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                        </svg>
                        <span>Zone Premium (1$/شهر)</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- محتوى بطاقات السوق -->
        <main class="market-content">
            <div class="section-title-wrap">
                <h2 class="section-title">السوق الطلابي الجامعي</h2>
                <p class="section-desc">مستلزمات، ملخصات، وأدوات هندسية وطبية متداولة مباشرة بين الطلاب</p>
            </div>

            <div class="products-grid" id="products-container">
                <!-- يتم توليد البطاقات عبر JavaScript -->
            </div>
        </main>
    </div>

    <!-- صندوق منبثق للتواصل والاشتراك -->
    <div class="modal-overlay" id="action-modal">
        <div class="modal-box">
            <h3 id="modal-title">تواصل مع البائع</h3>
            <p id="modal-desc">جاري فتح وسيلة الاتصال المباشرة...</p>
            <button class="btn-close" id="modal-close">إغلاق</button>
        </div>
    </div>

    <!-- تشغيل الوظائف البرمجية -->
    <script>
        // بيانات المنتجات الأولية في السوق الطلابي
        const productsData = [
            {
                id: 1,
                title: "حقيبة أدوات طب أسنان كاملة",
                category: "أدوات طبية",
                faculty: "طب الأسنان",
                city: "دمشق",
                price: 450000,
                seller: "طالب سنة رابعة",
                phone: "0933112233"
            },
            {
                id: 2,
                title: "فرجار هندسي احترافي ألماني + مسطرة T",
                category: "أدوات هندسية",
                faculty: "الهندسة المدنية والعمارة",
                city: "حلب",
                price: 180000,
                seller: "طالب سنة ثانية",
                phone: "0944556677"
            },
            {
                id: 3,
                title: "نوطة وملخص التشريح العام الشامل",
                category: "ملخصات جامعية",
                faculty: "الطب البشري",
                city: "حمص",
                price: 45000,
                seller: "طالب سنة ثانية",
                phone: "0955889900"
            },
            {
                id: 4,
                title: "بورد تجارب Arduino UNO مع ملحقات وحساسات",
                category: "أدوات هندسية",
                faculty: "هندسة ميكاترونيكس وحواسيب",
                city: "حلب",
                price: 260000,
                seller: "طالب سنة ثالثة",
                phone: "0966123456"
            },
            {
                id: 5,
                title: "سماعة طبيب Littmann Classic أصلية",
                category: "أدوات طبية",
                faculty: "الطب البشري",
                city: "اللاذقية",
                price: 680000,
                seller: "طالب ستاجات",
                phone: "0988765432"
            },
            {
                id: 6,
                title: "مجموعة مراجع القانون المدني المقارن",
                category: "كتب وملخصات",
                faculty: "الحقوق",
                city: "طرطوس",
                price: 75000,
                seller: "طالب دراسات",
                phone: "0999001122"
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const splashScreen = document.getElementById("splash-screen");
            const authScreen = document.getElementById("auth-screen");
            const marketScreen = document.getElementById("market-screen");
            const studentForm = document.getElementById("student-form");
            const productsContainer = document.getElementById("products-container");
            const userDisplayPill = document.getElementById("user-display-pill");

            const modal = document.getElementById("action-modal");
            const modalTitle = document.getElementById("modal-title");
            const modalDesc = document.getElementById("modal-desc");
            const modalClose = document.getElementById("modal-close");
            const premiumBtn = document.getElementById("premium-btn");

            // 1. إدارة توقيت الشاشة الترحيبية (ثانيتان تماماً ثم Fade Out)
            setTimeout(() => {
                splashScreen.classList.add("fade-out");

                setTimeout(() => {
                    splashScreen.style.display = "none";
                    authScreen.style.display = "flex";
                    // إضافة التأثير السلس لظهور صفحة الدخول
                    setTimeout(() => authScreen.classList.add("visible"), 20);
                }, 600); // مدة انتهاء انسياب الـ Fade
            }, 2000);

            // 2. معالجة نموذج تسجيل بيانات الطالب والانتقال للسوق
            studentForm.addEventListener("submit", (e) => {
                e.preventDefault();

                const studentName = document.getElementById("student-name").value.trim();
                const studentUni = document.getElementById("student-university").value;
                const studentFaculty = document.getElementById("student-faculty").value.trim();

                // تحديث معلومات المستخدم في شريط الهيدر
                userDisplayPill.textContent = `${studentName} | ${studentUni}`;

                // إخفاء شاشة تسجيل الدخول وإظهار السوق الطلابي بسلاسة
                authScreen.classList.remove("visible");
                setTimeout(() => {
                    authScreen.style.display = "none";
                    marketScreen.classList.add("active");
                    renderMarketProducts();
                }, 400);
            });

            // 3. بناء وعرض بطاقات المنتجات
            function renderMarketProducts() {
                productsContainer.innerHTML = "";
                productsData.forEach((item) => {
                    const card = document.createElement("div");
                    card.className = "product-card";
                    card.innerHTML = `
            <div>
              <div class="card-top">
                <span class="item-category">${item.category}</span>
                <span class="item-location">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
                  ${item.city}
                </span>
              </div>
              <h3 class="item-title">${item.title}</h3>
              <p class="item-faculty">${item.faculty}</p>
            </div>
            <div class="card-footer">
              <div class="item-price">
                <span class="price-value">${item.price.toLocaleString("ar-SY")}</span>
                <span class="price-unit">ليرة سورية</span>
              </div>
              <button class="btn-contact" onclick="openContactModal('${item.title}', '${item.phone}', '${item.seller}')">
                تواصل مع البائع
              </button>
            </div>
          `;
                    productsContainer.appendChild(card);
                });
            }

            // 4. النوافذ المنبثقة للتفاعل
            window.openContactModal = function (title, phone, seller) {
                modalTitle.textContent = "تواصل مع صاحب الغرض";
                modalDesc.innerHTML = `
          <strong>${title}</strong><br>
          المعلن: ${seller}<br>
          رقم الهاتف: <span dir="ltr" style="color:var(--orange-neon); font-weight:bold;">${phone}</span><br>
          (يمكنك الاتصال هاتفياً أو عبر واتساب مباشرة)
        `;
                modal.classList.add("active");
            };

            premiumBtn.addEventListener("click", () => {
                modalTitle.textContent = "عضوية Zone Premium";
                modalDesc.innerHTML = `
          احصل على تمييز عروضك الجامعية، تثبيت البطاقات في الواجهة الأولى، والتواصل غير المحدود بسعر <strong>1$ شهرياً</strong> أو <strong>10$ سنوياً</strong> عبر وسائل الدفع المحلية.
        `;
                modal.classList.add("active");
            });

            modalClose.addEventListener("click", () => {
                modal.classList.remove("active");
            });

            modal.addEventListener("click", (e) => {
                if (e.target === modal) modal.classList.remove("active");
            });
        });
    </script>
</body>

</html>
