<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaLink - شبكة اللوجستيات الدوائية</title>
    <!-- استيراد خط القاهرة (Cairo) الرسمي من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- استيراد FontAwesome للأيقونات عبر CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           1. التصميم العام والأنماط الأساسية (Cairo Font & Imperial Red Theme)
           ========================================================================== */
        :root {
            --primary-red: #CC0000;
            --secondary-gray: #707070;
            --bg-canvas: #F8FAFC;
            --white: #FFFFFF;
            --text-dark: #1E293B;
            --border-color: #E2E8F0;
            --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif !important;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* نظام إدارة الشاشات (Views Router) */
        .app-view {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
        }

        .app-view.active {
            display: flex;
        }

        /* ==========================================================================
           2. المرحلة الأولى: شاشة البداية السينمائية (Cinematic Splash Screen)
           ========================================================================== */
        #splash-screen {
            background-color: var(--white);
            justify-content: center;
            align-items: center;
            position: fixed;
            inset: 0;
            z-index: 9999;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* الكبسولة الطبية المنقسمة ديناميكياً */
        .capsule-logo {
            width: 140px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            position: relative;
            box-shadow: 0 0 25px rgba(204, 0, 0, 0.4);
            animation: capsuleDrop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, capsulePulse 2.5s infinite ease-in-out 1.2s;
            overflow: hidden;
            border: 2px solid var(--white);
        }

        .capsule-right {
            width: 50%;
            background-color: var(--primary-red);
            height: 100%;
        }

        .capsule-left {
            width: 50%;
            background-color: var(--secondary-gray);
            height: 100%;
            position: relative;
        }

        .capsule-left::after {
            content: '';
            position: absolute;
            left: 15px;
            top: 10px;
            width: 15px;
            height: 35px;
            border-left: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: rotate(-25deg);
        }

        .capsule-seam {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--white);
            transform: translateX(-50%);
            z-index: 2;
        }

        @keyframes capsuleDrop {
            0% {
                transform: translateY(-120px) scale(0.8);
                opacity: 0;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes capsulePulse {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(204, 0, 0, 0.3);
            }

            50% {
                box-shadow: 0 0 35px rgba(204, 0, 0, 0.6);
            }
        }

        .splash-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeInText 1s ease-in-out 0.5s forwards;
        }

        .splash-title .brand-pharma {
            color: var(--secondary-gray);
        }

        .splash-title .brand-link {
            color: var(--primary-red);
        }

        @keyframes fadeInText {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================================================
           3. المرحلة الثانية: بوابة اعتماد بيانات الاعتماد (Credentials Gateway)
           ========================================================================== */
        #gateway-screen {
            background-color: var(--bg-canvas);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .gateway-card {
            background-color: var(--white);
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            border-top: 6px solid var(--primary-red);
            padding: 36px 32px;
            position: relative;
            overflow: hidden;
        }

        .gateway-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .gateway-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .gateway-header p {
            font-size: 13px;
            color: var(--secondary-gray);
        }

        .form-step {
            display: none;
            animation: slideInStep 0.4s ease forwards;
        }

        .form-step.active-step {
            display: block;
        }

        @keyframes slideInStep {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--secondary-gray);
            margin-bottom: 8px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: var(--transition-smooth);
            background-color: var(--white);
            color: var(--text-dark);
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 0 4px rgba(204, 0, 0, 0.1);
        }

        .role-selector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .role-card {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            background: var(--white);
        }

        .role-card input[type="radio"] {
            display: none;
        }

        .role-card i {
            font-size: 24px;
            color: var(--secondary-gray);
            margin-bottom: 8px;
            display: block;
        }

        .role-card span {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .role-card.selected {
            border-color: var(--primary-red);
            background-color: rgba(204, 0, 0, 0.03);
        }

        .role-card.selected i {
            color: var(--primary-red);
        }

        .gateway-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-red);
            color: var(--white);
            flex: 1;
        }

        .btn-primary:hover {
            background-color: #b30000;
            box-shadow: 0 4px 12px rgba(204, 0, 0, 0.3);
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--secondary-gray);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        /* ==========================================================================
           4. المرحلة الثالثة: بيئات العمل ومنصات الإدارة (Workspaces & Navigation)
           ========================================================================== */
        #workspace-screen {
            background-color: var(--bg-canvas);
            padding-bottom: 90px;
        }

        .app-topbar {
            background-color: var(--white);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .network-alert-banner {
            background-color: rgba(204, 0, 0, 0.08);
            border-right: 4px solid var(--primary-red);
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-red);
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            margin-left: 15px;
        }

        .user-mini-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--secondary-gray);
        }

        .user-mini-badge i {
            color: var(--primary-red);
        }

        .workspace-body {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .section-header {
            margin-bottom: 20px;
        }

        .section-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .section-header p {
            font-size: 12px;
            color: var(--secondary-gray);
        }

        .filter-pills {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .filter-pill {
            padding: 6px 16px;
            background-color: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--secondary-gray);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition-smooth);
        }

        .filter-pill.active {
            background-color: var(--primary-red);
            color: var(--white);
            border-color: var(--primary-red);
        }

        .search-box-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            background-color: var(--white);
            outline: none;
        }

        .search-box-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-gray);
        }

        .data-table-container {
            background-color: var(--white);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            margin-bottom: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        .data-table th {
            background-color: #F1F5F9;
            color: var(--secondary-gray);
            font-size: 12px;
            font-weight: 700;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table td {
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border-color);
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
        }

        .badge-success {
            background-color: #DCFCE7;
            color: #15803D;
        }

        .badge-warning {
            background-color: #FEF9C3;
            color: #A16207;
        }

        .badge-danger {
            background-color: #FEE2E2;
            color: #B91C1C;
        }

        .warehouse-form-grid {
            background-color: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .bottom-nav-ribbon {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--white);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary-gray);
            font-size: 11px;
            font-weight: 600;
            gap: 4px;
            position: relative;
            transition: var(--transition-smooth);
            padding: 4px 12px;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--primary-red);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            width: 20px;
            height: 3px;
            background-color: var(--primary-red);
            border-radius: 2px;
        }

        .nav-badge {
            position: absolute;
            top: 0;
            right: 15px;
            background-color: var(--primary-red);
            color: var(--white);
            font-size: 9px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
        }

        .account-hub-card {
            background-color: var(--white);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 25px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: var(--shadow-soft);
        }

        .account-avatar {
            width: 70px;
            height: 70px;
            background-color: rgba(204, 0, 0, 0.1);
            color: var(--primary-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 15px;
        }
    </style>
</head>

<body>

    <!-- STAGE 1: شاشة البداية السينمائية -->
    <div id="splash-screen" class="app-view active">
        <div class="splash-content">
            <div class="capsule-logo">
                <div class="capsule-right"></div>
                <div class="capsule-seam"></div>
                <div class="capsule-left"></div>
            </div>
            <h1 class="splash-title">
                <span class="brand-pharma">Pharma</span><span class="brand-link">Link</span>
            </h1>
        </div>
    </div>

    <!-- STAGE 2: بوابة اعتماد بيانات الاعتماد -->
    <div id="gateway-screen" class="app-view">
        <div class="gateway-card">
            <div class="gateway-header">
                <div class="capsule-logo" style="width: 90px; height: 38px; margin: 0 auto 15px; box-shadow: none;">
                    <div class="capsule-right"></div>
                    <div class="capsule-seam"></div>
                    <div class="capsule-left"></div>
                </div>
                <h2>غرفة تعبئة معلومات المنصة</h2>
                <p>يرجى إدخال بيانات المصرح الطبي بدقة عالية للولوج الفوري للشبكة</p>
            </div>

            <form id="gateway-form" onsubmit="event.preventDefault();">
                <div class="form-step active-step" id="step-1">
                    <div class="input-group">
                        <label for="facility-name">اسم المنشأة الطبية / الحساب</label>
                        <input type="text" id="facility-name"
                            placeholder="مثال: صيدلية النور المركزية / مستودع الشفاء الدوائي" required>
                    </div>
                    <div class="gateway-actions">
                        <button type="button" class="btn btn-primary" onclick="nextStep(2)">التالي <i
                                class="fa-solid fa-arrow-left"></i></button>
                    </div>
                </div>

                <div class="form-step" id="step-2">
                    <div class="input-group">
                        <label for="facility-pass">رمز التشغيل اللوجستي السريع (Password)</label>
                        <input type="password" id="facility-pass" placeholder="أدخل رمز الحماية المشفر" required>
                    </div>
                    <div class="gateway-actions">
                        <button type="button" class="btn btn-secondary" onclick="prevStep(1)"><i
                                class="fa-solid fa-arrow-right"></i> السابق</button>
                        <button type="button" class="btn btn-primary" onclick="nextStep(3)">التالي <i
                                class="fa-solid fa-arrow-left"></i></button>
                    </div>
                </div>

                <div class="form-step" id="step-3">
                    <div class="input-group">
                        <label for="facility-region">نطاق البث والتوزيع الجغرافي المتاح (Region Hub)</label>
                        <select id="facility-region" required>
                            <option value="حلب">حلب (Aleppo)</option>
                            <option value="إدلب">إدلب (Idlib)</option>
                            <option value="منبج">منبج (Menbij)</option>
                            <option value="ريف حلب والريف الشمالي">ريف حلب والريف الشمالي</option>
                        </select>
                    </div>
                    <div class="gateway-actions">
                        <button type="button" class="btn btn-secondary" onclick="prevStep(2)"><i
                                class="fa-solid fa-arrow-right"></i> السابق</button>
                        <button type="button" class="btn btn-primary" onclick="nextStep(4)">التالي <i
                                class="fa-solid fa-arrow-left"></i></button>
                    </div>
                </div>

                <div class="form-step" id="step-4">
                    <label
                        style="display: block; font-size: 13px; font-weight: 600; color: var(--secondary-gray); margin-bottom: 12px;">اختر
                        صففتك المهنية في الشبكة:</label>
                    <div class="role-selector-grid">
                        <label class="role-card selected" id="role-pharmacist-card" onclick="selectRole('pharmacist')">
                            <input type="radio" name="user-role" value="pharmacist" checked>
                            <i class="fa-solid fa-pills"></i>
                            <span>صيدلاني</span>
                        </label>
                        <label class="role-card" id="role-warehouse-card" onclick="selectRole('warehouse')">
                            <input type="radio" name="user-role" value="warehouse">
                            <i class="fa-solid fa-warehouse"></i>
                            <span>صاحب مستودع</span>
                        </label>
                    </div>
                    <div class="gateway-actions">
                        <button type="button" class="btn btn-secondary" onclick="prevStep(3)"><i
                                class="fa-solid fa-arrow-right"></i> السابق</button>
                        <button type="submit" class="btn btn-primary" onclick="completeLogin()">تسجيل الدخول <i
                                class="fa-solid fa-check"></i></button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- STAGE 3: مساحات العمل المعزولة والشريط السفلي -->
    <div id="workspace-screen" class="app-view">
        <header class="app-topbar">
            <div class="network-alert-banner" id="network-ticker">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>[تنبيه الشبكة]: تم توجيه طلبيتك الرقمية الفورية مباشرة للمستودع الإقليمي بنجاح.</span>
            </div>
            <div class="user-mini-badge">
                <i class="fa-solid fa-user-shield"></i>
                <span id="display-user-meta">أوزكان بيك</span>
            </div>
        </header>

        <main class="workspace-body" id="dynamic-workspace-container"></main>

        <nav class="bottom-nav-ribbon">
            <button class="nav-item active" onclick="switchWorkspaceTab(0)" id="nav-btn-0">
                <i class="fa-solid fa-store" id="icon-tab-0"></i>
                <span id="label-tab-0">سوق الأدوية</span>
            </button>
            <button class="nav-item" onclick="switchWorkspaceTab(1)" id="nav-btn-1">
                <i class="fa-solid fa-cart-shopping" id="icon-tab-1"></i>
                <span id="label-tab-1">سلة الطلب</span>
                <span class="nav-badge" id="cart-counter-badge">0</span>
            </button>
            <button class="nav-item" onclick="switchWorkspaceTab(2)" id="nav-btn-2">
                <i class="fa-solid fa-network-wired"></i>
                <span>الشبكة</span>
            </button>
            <button class="nav-item" onclick="switchWorkspaceTab(3)" id="nav-btn-3">
                <i class="fa-solid fa-user-gear"></i>
                <span>الحساب</span>
            </button>
        </nav>
    </div>

    <!-- محرك الحالة البرمجي المتقدم -->
    <script>
        const appState = {
            currentStage: 'splash',
            user: { facilityName: '', role: 'pharmacist', region: 'حلب' },
            activeTab: 0,
            cart: [],
            medicines: [
                { id: 1, name: 'باراسيتامول 500 مغ', category: 'مسكنات', warehouse: 'مستودع الألفية الدوائي', price: 15.00, stock: 450, region: 'حلب' },
                { id: 2, name: 'أموكسيسيلين 250 مغ', category: 'مضادات حيوية', warehouse: 'مستودع حلب المركزى', price: 35.50, stock: 120, region: 'حلب' },
                { id: 3, name: 'إنسولين مكسارد 100 وحدة', category: 'أدوية مزمنة', warehouse: 'مستودع ابن سينا', price: 120.00, stock: 85, region: 'إدلب' },
                { id: 4, name: 'كمامات طبية معقمة (علبة 50)', category: 'مستلزمات طبية', warehouse: 'مستودع النور اللوجستي', price: 25.00, stock: 1000, region: 'منبج' },
                { id: 5, name: 'ديكلوفيناك الصوديوم امبولات', category: 'مسكنات', warehouse: 'مستودع الشفاء الدوائي', price: 40.00, stock: 300, region: 'حلب' }
            ],
            incomingInvoices: [
                { id: 'ORD-9821', pharmacy: 'صيدلية الحياة', drug: 'باراسيتامول 500 مغ', qty: 50, status: 'قيد المراجعة' },
                { id: 'ORD-9822', pharmacy: 'صيدلية الأمل', drug: 'أموكسيسيلين 250 مغ', qty: 20, status: 'مقبولة' }
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { transitionToStage('gateway'); }, 3500);
        });

        function transitionToStage(stageName) {
            document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active'));
            appState.currentStage = stageName;
            if (stageName === 'splash') document.getElementById('splash-screen').classList.add('active');
            else if (stageName === 'gateway') document.getElementById('gateway-screen').classList.add('active');
            else if (stageName === 'workspace') {
                document.getElementById('workspace-screen').classList.add('active');
                renderWorkspace();
            }
        }

        function nextStep(stepNumber) {
            if (stepNumber === 2) {
                const fName = document.getElementById('facility-name').value.trim();
                if (!fName) { alert('يرجى إدخال اسم المنشأة الطبية للمتابعة.'); return; }
                appState.user.facilityName = fName;
            }
            document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active-step'));
            document.getElementById(`step-${stepNumber}`).classList.add('active-step');
        }

        function prevStep(stepNumber) {
            document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active-step'));
            document.getElementById(`step-${stepNumber}`).classList.add('active-step');
        }

        function selectRole(role) {
            appState.user.role = role;
            document.querySelectorAll('.role-card').forEach(card => card.classList.remove('selected'));
            if (role === 'pharmacist') {
                document.getElementById('role-pharmacist-card').classList.add('selected');
                document.querySelector('#role-pharmacist-card input').checked = true;
            } else {
                document.getElementById('role-warehouse-card').classList.add('selected');
                document.querySelector('#role-warehouse-card input').checked = true;
            }
        }

        function completeLogin() {
            const pass = document.getElementById('facility-pass').value.trim();
            const region = document.getElementById('facility-region').value;
            if (!pass) { alert('يرجى إدخال رمز التشغيل اللوجستي السريع.'); return; }
            appState.user.region = region;
            document.getElementById('display-user-meta').textContent = `${appState.user.facilityName} (${appState.user.role === 'pharmacist' ? 'صيدلاني' : 'مستودع'})`;
            configureBottomNavigation();
            transitionToStage('workspace');
        }

        function configureBottomNavigation() {
            const isPharm = appState.user.role === 'pharmacist';
            document.getElementById('icon-tab-0').className = isPharm ? "fa-solid fa-store" : "fa-solid fa-boxes-stacked";
            document.getElementById('label-tab-0').textContent = isPharm ? "سوق الأدوية" : "مخزوني";
            document.getElementById('icon-tab-1').className = isPharm ? "fa-solid fa-cart-shopping" : "fa-solid fa-clipboard-list";
            document.getElementById('label-tab-1').textContent = isPharm ? "سلة الطلب" : "الطلبات الواردة";
            updateBadges();
        }

        function updateBadges() {
            const badge = document.getElementById('cart-counter-badge');
            if (appState.user.role === 'pharmacist') badge.textContent = appState.cart.length;
            else badge.textContent = appState.incomingInvoices.filter(i => i.status === 'قيد المراجعة').length;
        }

        function switchWorkspaceTab(tabIndex) {
            appState.activeTab = tabIndex;
            document.querySelectorAll('.nav-item').forEach((item, idx) => {
                if (idx === tabIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
            renderWorkspace();
        }

        function renderWorkspace() {
            const container = document.getElementById('dynamic-workspace-container');
            container.innerHTML = '';
            if (appState.user.role === 'pharmacist') renderPharmacistDashboard(container);
            else renderWarehouseDashboard(container);
        }

        function renderPharmacistDashboard(container) {
            if (appState.activeTab === 0) {
                container.innerHTML = `
                    <div class="section-header">
                        <h3>سوق الأدوية المعتمد في نطاق: ${appState.user.region}</h3>
                        <p>استعراض وتأمين المستحضرات الدوائية من المستودعات المرخصة حصرياً</p>
                    </div>
                    <div class="filter-pills">
                        <div class="filter-pill active" onclick="filterMeds('الكل', this)">الكل</div>
                        <div class="filter-pill" onclick="filterMeds('مسكنات', this)">مسكنات</div>
                        <div class="filter-pill" onclick="filterMeds('مضادات حيوية', this)">مضادات حيوية</div>
                        <div class="filter-pill" onclick="filterMeds('أدوية مزمنة', this)">أدوية مزمنة</div>
                        <div class="filter-pill" onclick="filterMeds('مستلزمات طبية', this)">مستلزمات طبية</div>
                    </div>
                    <div class="search-box-wrapper">
                        <input type="text" id="med-search-input" placeholder="ابحث عن اسم الدواء أو المستودع المزود..." onkeyup="handleMedSearch()">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div class="data-table-container">
                        <table class="data-table" id="meds-table">
                            <thead>
                                <tr>
                                    <th>اسم الدواء والتركيز</th>
                                    <th>التصنيف</th>
                                    <th>المستودع المزود</th>
                                    <th>السعر ($)</th>
                                    <th>الكمية المتاحة</th>
                                    <th>الإجراء الفوري</th>
                                </tr>
                            </thead>
                            <tbody id="meds-table-body">${generateMedsTableRows(appState.medicines)}</tbody>
                        </table>
                    </div>
                `;
            } else if (appState.activeTab === 1) {
                let cartHtml = `
                    <div class="section-header">
                        <h3>سلة الطلبيات الرقمية المباشرة</h3>
                        <p>مراجعة الأصناف المضافة وإرسال الطلبية اللوجستية للمستودعات</p>
                    </div>
                `;
                if (appState.cart.length === 0) {
                    cartHtml += `
                        <div style="text-align: center; padding: 50px 20px; background: white; border-radius: 10px; border: 1px solid var(--border-color);">
                            <i class="fa-solid fa-cart-arrow-down" style="font-size: 48px; color: var(--secondary-gray); margin-bottom: 15px;"></i>
                            <p style="font-size: 14px; color: var(--secondary-gray);">السلة فارغة حالياً. انتقل إلى سوق الأدوية لإضافة أصناف جديدة.</p>
                        </div>
                    `;
                } else {
                    let totalSum = appState.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                    cartHtml += `
                        <div class="data-table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>الصنف الدوائي</th>
                                        <th>المستودع</th>
                                        <th>السعر المفرد</th>
                                        <th>الكمية</th>
                                        <th>الإجمالي</th>
                                        <th>إزالة</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${appState.cart.map((item, idx) => `
                                        <tr>
                                            <td><strong>${item.name}</strong></td>
                                            <td>${item.warehouse}</td>
                                            <td>$${item.price.toFixed(2)}</td>
                                            <td>${item.qty}</td>
                                            <td>$${(item.price * item.qty).toFixed(2)}</td>
                                            <td><button class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="removeFromCart(${idx})"><i class="fa-solid fa-trash"></i></button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color);">
                            <div>
                                <span style="font-size: 13px; color: var(--secondary-gray);">إجمالي قيمة الطلبية الكلية:</span>
                                <h3 style="color: var(--primary-red); font-size: 22px; font-weight: 900;">$${totalSum.toFixed(2)}</h3>
                            </div>
                            <button class="btn btn-primary" onclick="submitPharmacistOrder()"><i class="fa-solid fa-paper-plane"></i> إرسال الطلبيّة للمستودعات بشكل فوري</button>
                        </div>
                    `;
                }
                container.innerHTML = cartHtml;
            } else if (appState.activeTab === 2) {
                container.innerHTML = `
                    <div class="section-header">
                        <h3>مصفوفة صحة الشبكة اللوجستية (Network Health Matrix)</h3>
                        <p>رصد ومراقبة مؤشرات التبادل الدوائي عبر محافظات شمال غرب سوريا</p>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px;">
                        <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); border-right: 4px solid var(--primary-red);">
                            <span style="font-size: 12px; color: var(--secondary-gray);">المستودعات المرتبطة</span>
                            <h2 style="font-size: 24px; font-weight: 700; margin-top: 5px;">14 مستودع</h2>
                        </div>
                        <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); border-right: 4px solid var(--secondary-gray);">
                            <span style="font-size: 12px; color: var(--secondary-gray);">الصيدليات النشطة</span>
                            <h2 style="font-size: 24px; font-weight: 700; margin-top: 5px;">182 صيدلية</h2>
                        </div>
                        <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); border-right: 4px solid var(--primary-red);">
                            <span style="font-size: 12px; color: var(--secondary-gray);">حالة الربط السحابي</span>
                            <h2 style="font-size: 20px; font-weight: 700; margin-top: 5px; color: #15803D;"><i class="fa-solid fa-circle-check"></i> متصل بـ Vercel</h2>
                        </div>
                    </div>
                `;
            } else if (appState.activeTab === 3) {
                renderAccountHub(container);
            }
        }

        function renderWarehouseDashboard(container) {
            if (appState.activeTab === 0) {
                container.innerHTML = `
                    <div class="section-header">
                        <h3>إدارة المخزون الدوائي المركزي</h3>
                        <p>إضافة وتحديث خطوط الأدوية مباشرة في قاعدة بيانات المستودع العالمية</p>
                    </div>
                    <div class="warehouse-form-grid">
                        <h4 style="font-size: 15px; font-weight: 700; margin-bottom: 15px; color: var(--text-dark);">إضافة صنف دوائي جديد للشبكة</h4>
                        <form onsubmit="handleAddNewDrug(event)">
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px;">
                                <div class="input-group" style="margin-bottom:0;">
                                    <label>اسم الدواء والتركيز</label>
                                    <input type="text" id="new-drug-name" placeholder="مثال: أمبريسول شراب 100 مل" required>
                                </div>
                                <div class="input-group" style="margin-bottom:0;">
                                    <label>التصنيف العلاجي</label>
                                    <select id="new-drug-cat">
                                        <option value="مسكنات">مسكنات</option>
                                        <option value="مضادات حيوية">مضادات حيوية</option>
                                        <option value="أدوية مزمنة">أدوية مزمنة</option>
                                        <option value="مستلزمات طبية">مستلزمات طبية</option>
                                    </select>
                                </div>
                                <div class="input-group" style="margin-bottom:0;">
                                    <label>السعر بالدولار ($)</label>
                                    <input type="number" step="0.01" id="new-drug-price" placeholder="10.00" required>
                                </div>
                                <div class="input-group" style="margin-bottom:0;">
                                    <label>الكمية المتوفرة</label>
                                    <input type="number" id="new-drug-stock" placeholder="500" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> اعتماد وإضافة الصنف للشبكة الفورية</button>
                        </form>
                    </div>
                    <div class="section-header">
                        <h3>قائمة المخزون الحالي المسجل باسم المستودع</h3>
                    </div>
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>الصنف الدوائي</th>
                                    <th>التصنيف</th>
                                    <th>السعر</th>
                                    <th>الرصيد المتاحة</th>
                                    <th>نطاق التوزيع</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${appState.medicines.map(m => `
                                    <tr>
                                        <td><strong>${m.name}</strong></td>
                                        <td>${m.category}</td>
                                        <td>$${m.price.toFixed(2)}</td>
                                        <td>${m.stock} وحدة</td>
                                        <td>${m.region}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (appState.activeTab === 1) {
                container.innerHTML = `
                    <div class="section-header">
                        <h3>الطلبات الواردة من الصيدليات المركزية (Requests Queue)</h3>
                        <p>مراجعة وإدارة حالة الفواتير والطلبيات المباشرة الواردة للصيدليات</p>
                    </div>
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>رقم الطلب</th>
                                    <th>الصيدلية الطالبة</th>
                                    <th>الصنف والكمية</th>
                                    <th>الحالة التشغيلية</th>
                                    <th>الإجراء السريع</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${appState.incomingInvoices.map((inv, idx) => `
                                    <tr>
                                        <td><strong>${inv.id}</strong></td>
                                        <td>${inv.pharmacy}</td>
                                        <td>${inv.drug} (${inv.qty} وحدة)</td>
                                        <td><span class="badge-status ${inv.status === 'مقبولة' ? 'badge-success' : (inv.status === 'مرفوضة' ? 'badge-danger' : 'badge-warning')}">${inv.status}</span></td>
                                        <td>
                                            <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 11px; background-color: #DCFCE7; color: #15803D;" onclick="updateInvoiceStatus(${idx}, 'مقبولة')"><i class="fa-solid fa-check"></i> قبول</button>
                                            <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 11px; background-color: #FEE2E2; color: #B91C1C;" onclick="updateInvoiceStatus(${idx}, 'مرفوضة')"><i class="fa-solid fa-xmark"></i> رفض</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (appState.activeTab === 2) {
                container.innerHTML = `
                    <div class="section-header">
                        <h3>إحصائيات حركة التوزيع المركزية للمستودع</h3>
                    </div>
                    <div style="background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border-color);">
                        <p style="font-size: 14px; color: var(--secondary-gray); line-height: 1.6;">جميع العمليات متزامنة لحظياً عبر مستودعات حلب، إدلب، ومنبج. نسبة نجاح تسليم الطلبيات بلغت 99.4% هذا الأسبوع.</p>
                    </div>
                `;
            } else if (appState.activeTab === 3) {
                renderAccountHub(container);
            }
        }

        function renderAccountHub(container) {
            container.innerHTML = `
                <div class="account-hub-card">
                    <div class="account-avatar">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <h3 style="font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 5px;">${appState.user.facilityName}</h3>
                    <p style="font-size: 12px; color: var(--secondary-gray); margin-bottom: 15px;">
                        الصفة المهنية: <strong style="color: var(--primary-red);">${appState.user.role === 'pharmacist' ? 'صيدلاني معتمد' : 'صاحب مستودع دوائي'}</strong>
                    </p>
                    <p style="font-size: 12px; color: var(--secondary-gray); margin-bottom: 25px;">
                        نطاق الإرسال الجغرافي: <strong>${appState.user.region}</strong>
                    </p>
                    <button class="btn btn-primary" style="width: 100%; background-color: var(--primary-red);" onclick="secureLogout()">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج الآمن
                    </button>
                </div>
            `;
        }

        function generateMedsTableRows(medsArray) {
            if (medsArray.length === 0) return `<tr><td colspan="6" style="text-align: center; color: var(--secondary-gray); padding: 20px;">لا توجد أصناف دوائية مطابقة في هذا النطاق حالياً.</td></tr>`;
            return medsArray.map(m => `
                <tr>
                    <td><strong>${m.name}</strong></td>
                    <td>${m.category}</td>
                    <td>${m.warehouse}</td>
                    <td>$${m.price.toFixed(2)}</td>
                    <td>${m.stock} وحدة</td>
                    <td>
                        <button class="btn btn-primary" style="padding: 6px 12px; font-size: 11px;" onclick="addToCart(${m.id})">
                            <i class="fa-solid fa-cart-plus"></i> طلب فوري
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function addToCart(medId) {
            const med = appState.medicines.find(m => m.id === medId);
            if (!med) return;
            const existing = appState.cart.find(item => item.id === medId);
            if (existing) existing.qty += 1;
            else appState.cart.push({ ...med, qty: 1 });
            updateBadges();
            alert(`تمت إضافة "${med.name}" إلى سلة الطلبيات الرقمية بنجاح.`);
        }

        function removeFromCart(index) {
            appState.cart.splice(index, 1);
            updateBadges();
            renderWorkspace();
        }

        function submitPharmacistOrder() {
            if (appState.cart.length === 0) return;
            appState.cart.forEach(item => {
                appState.incomingInvoices.unshift({
                    id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                    pharmacy: appState.user.facilityName,
                    drug: item.name,
                    qty: item.qty,
                    status: 'قيد المراجعة'
                });
            });
            appState.cart = [];
            updateBadges();
            alert('تم إرسال الطلبية الدوائية الرقمية للمستودعات المركزية بنجاح فائق!');
            switchWorkspaceTab(0);
        }

        function updateInvoiceStatus(index, newStatus) {
            appState.incomingInvoices[index].status = newStatus;
            updateBadges();
            renderWorkspace();
        }

        function handleAddNewDrug(e) {
            e.preventDefault();
            const name = document.getElementById('new-drug-name').value.trim();
            const category = document.getElementById('new-drug-cat').value;
            const price = parseFloat(document.getElementById('new-drug-price').value);
            const stock = parseInt(document.getElementById('new-drug-stock').value);
            if (!name || isNaN(price) || isNaN(stock)) return;
            appState.medicines.push({
                id: appState.medicines.length + 1,
                name: name,
                category: category,
                warehouse: appState.user.facilityName,
                price: price,
                stock: stock,
                region: appState.user.region
            });
            alert('تم إدراج الصنف الدوائي الجديد في الشبكة المركزية بنجاح.');
            renderWorkspace();
        }

        function filterMeds(category, element) {
            document.querySelectorAll('.filter-pill').forEach(pill => pill.classList.remove('active'));
            element.classList.add('active');
            const tbody = document.getElementById('meds-table-body');
            let filtered = appState.medicines;
            if (category !== 'الكل') filtered = appState.medicines.filter(m => m.category === category);
            tbody.innerHTML = generateMedsTableRows(filtered);
        }

        function handleMedSearch() {
            const query = document.getElementById('med-search-input').value.toLowerCase();
            const filtered = appState.medicines.filter(m =>
                m.name.toLowerCase().includes(query) || m.warehouse.toLowerCase().includes(query)
            );
            document.getElementById('meds-table-body').innerHTML = generateMedsTableRows(filtered);
        }

        function secureLogout() {
            appState.user = { facilityName: '', role: 'pharmacist', region: 'حلب' };
            appState.cart = [];
            document.getElementById('facility-name').value = '';
            document.getElementById('facility-pass').value = '';
            transitionToStage('gateway');
        }
    </script>
</body>

</html>
