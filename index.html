<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaLink - فارمالينك</title>
    <!-- خط Cairo للأوزان العريضة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
    <!-- مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --feather-teal: #145A56;
            --rock-grey: #707070;
            --clinical-white: #FFFFFF;
            --bg-body: #F4F6F9;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 1. شعار الكبسولة المنقسمة (Split-Capsule Logo) */
        .split-capsule {
            display: inline-flex;
            width: 140px;
            height: 60px;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .capsule-right {
            width: 50%;
            background-color: var(--feather-teal);
            height: 100%;
        }

        .capsule-left {
            width: 50%;
            background-color: var(--rock-grey);
            height: 100%;
            position: relative;
        }

        .capsule-divider {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background-color: var(--clinical-white);
            transform: translateX(-50%);
            z-index: 2;
        }

        /* 2. شاشة الترحيب الحركية الفائقة (Advanced Dynamic Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--clinical-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .splash-logo-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0);
            opacity: 0;
            animation: advancedElasticBounce 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .shadow-ripple {
            position: absolute;
            width: 160px;
            height: 80px;
            border-radius: 40px;
            background: rgba(20, 90, 86, 0.2);
            z-index: -1;
            transform: scale(1);
            animation: radialRippleAura 2s infinite ease-out;
        }

        @keyframes advancedElasticBounce {
            0% {
                transform: scale(0.1);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
                opacity: 1;
            }

            80% {
                transform: scale(0.95);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes radialRippleAura {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        .splash-title {
            margin-top: 25px;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInSlideUp 1s ease 1.5s forwards;
        }

        .splash-title span.pharma {
            color: var(--rock-grey);
        }

        .splash-title span.link {
            color: var(--feather-teal);
        }

        @keyframes fadeInSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3. بوابة التحقق متعددة الخطوات (Multi-Step Credentials Gateway) */
        #gateway-screen {
            display: none;
            flex: 1;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #d7e1ec 100%);
        }

        .gateway-card {
            background: var(--clinical-white);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .gateway-card h2 {
            font-size: 26px;
            font-weight: 900;
            color: var(--rock-grey);
            margin-bottom: 25px;
        }

        .gateway-step {
            display: none;
            text-align: right;
            animation: slideInStep 0.4s ease;
        }

        .gateway-step.active {
            display: block;
        }

        @keyframes slideInStep {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 900;
            margin-bottom: 8px;
            color: var(--rock-grey);
            font-size: 14px;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--rock-grey);
        }

        .gateway-input,
        .gateway-select {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            outline: none;
            transition: border-color 0.3s;
        }

        .gateway-input:focus,
        .gateway-select:focus {
            border-color: var(--feather-teal);
        }

        /* مفاتيح التبديل الفاخرة (Premium Toggles) */
        .toggle-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .toggle-option {
            flex: 1;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 900;
            font-size: 14px;
            transition: all 0.3s;
            background: #fff;
        }

        .toggle-option.selected {
            border-color: var(--feather-teal);
            background-color: rgba(20, 90, 86, 0.05);
            color: var(--feather-teal);
        }

        .gateway-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-gateway {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-next {
            background-color: var(--feather-teal);
            color: #fff;
        }

        .btn-prev {
            background-color: var(--rock-grey);
            color: #fff;
        }

        .btn-gateway:hover {
            opacity: 0.9;
        }

        /* 4. بيئات العمل وشريط التنقل */
        #app-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding-bottom: 80px;
        }

        .app-header {
            background: var(--clinical-white);
            padding: 15px 25px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
            flex-wrap: wrap;
            gap: 15px;
        }

        .app-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .app-header-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--feather-teal);
        }

        .app-header-meta {
            font-size: 13px;
            font-weight: 900;
            color: var(--rock-grey);
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* زر تحويل العملات المطور */
        .currency-switcher {
            display: flex;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 4px;
            border: 2px solid var(--border-color);
        }

        .currency-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 6px;
            color: var(--rock-grey);
            transition: all 0.3s;
        }

        .currency-btn.active {
            background: var(--feather-teal);
            color: #fff;
        }

        .app-content {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* شريط التنقل السفلي */
        .bottom-ribbon {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--clinical-white);
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .ribbon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--rock-grey);
            font-size: 12px;
            font-weight: 900;
            transition: color 0.3s;
            flex: 1;
        }

        .ribbon-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .ribbon-item.active {
            color: var(--feather-teal);
        }

        /* شريط البحث وتصفية التصنيفات */
        .search-filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input-box {
            flex: 1;
            position: relative;
            min-width: 250px;
        }

        .search-input-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--rock-grey);
        }

        .search-input-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            outline: none;
        }

        .search-input-box input:focus {
            border-color: var(--feather-teal);
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .chip {
            padding: 8px 16px;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            white-space: nowrap;
            color: var(--rock-grey);
            transition: all 0.3s;
        }

        .chip.active {
            background: var(--feather-teal);
            color: #fff;
            border-color: var(--feather-teal);
        }

        /* الجداول والبطاقات المهندسة */
        .data-table-container {
            background: #fff;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 800;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            color: var(--rock-grey);
            font-weight: 900;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .btn-action {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 900;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            opacity: 0.85;
        }

        .btn-primary-action {
            background: var(--feather-teal);
            color: #fff;
        }

        .btn-secondary-action {
            background: var(--rock-grey);
            color: #fff;
        }

        /* مؤشرات الكميات الديناميكية */
        .stock-indicator {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            display: inline-block;
        }

        .stock-high {
            background: #d1fae5;
            color: #059669;
        }

        .stock-low {
            background: #fef3c7;
            color: #d97706;
        }

        /* سلة الطلب */
        .cart-summary-box {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            margin-top: 20px;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 900;
            font-size: 15px;
        }

        .cart-summary-row.total {
            font-size: 18px;
            color: var(--feather-teal);
            border-top: 2px dashed var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
        }

        .btn-wide-checkout {
            width: 100%;
            padding: 16px;
            background: #25D366;
            /* لون واتساب المميز */
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-wide-checkout:hover {
            opacity: 0.9;
        }

        /* إحصائيات الشبكة */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .stat-card-title {
            font-size: 14px;
            color: var(--rock-grey);
            font-weight: 900;
            margin-bottom: 10px;
        }

        .stat-card-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--feather-teal);
        }

        /* نافذة منبثقة (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: scaleModal 0.3s ease;
        }

        @keyframes scaleModal {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 900;
            color: var(--rock-grey);
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--rock-grey);
        }

        /* أزرار تفاعلية للطلبات الواردة */
        .order-status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
        }

        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }

        .status-accepted {
            background: #065f46;
            color: #fff;
        }

        .status-rejected {
            background: #991b1b;
            color: #fff;
        }

        .btn-status-group {
            display: flex;
            gap: 8px;
        }

        .btn-accept {
            background: #065f46;
            color: #fff;
        }

        .btn-reject {
            background: #991b1b;
            color: #fff;
        }

        /* بطاقة الحساب والخروج الآمن */
        .account-card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            max-width: 600px;
            margin: 0 auto;
        }

        .account-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-weight: 900;
        }

        .account-row span:first-child {
            color: var(--rock-grey);
        }

        .btn-logout {
            width: 100%;
            padding: 14px;
            background: var(--rock-grey);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
            transition: opacity 0.3s;
        }

        .btn-logout:hover {
            opacity: 0.9;
        }

        /* إشعار التوست الحركي (Toast Notification) */
        #toast-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--feather-teal);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            z-index: 99999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #toast-notification.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <!-- إشعار التوست الحركي -->
    <div id="toast-notification">تمت العملية بنجاح</div>

    <!-- المرحلة الأولى: شاشة الترحيب الحركية الفائقة (Advanced Dynamic Splash Screen) -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="shadow-ripple"></div>
            <div class="split-capsule">
                <div class="capsule-right"></div>
                <div class="capsule-divider"></div>
                <div class="capsule-left"></div>
            </div>
        </div>
        <h1 class="splash-title">
            <span class="pharma">Pharma</span><span class="link">Link</span>
        </h1>
    </div>

    <!-- المرحلة الثانية: بوابة التحقق متعددة الخطوات (Multi-Step Credentials Gateway) -->
    <div id="gateway-screen">
        <div class="gateway-card">
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <div class="split-capsule" style="width: 100px; height: 45px;">
                    <div class="capsule-right"></div>
                    <div class="capsule-divider"></div>
                    <div class="capsule-left"></div>
                </div>
            </div>
            <h2>بوابة الاعتماد الطبية B2B</h2>

            <!-- الخطوة 1 -->
            <div class="gateway-step active" id="g-step-1">
                <div class="form-group">
                    <label>اسم المنشأة / المستخدم</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-hospital"></i>
                        <input type="text" id="input-facility-name" class="gateway-input"
                            placeholder="أدخل اسم صيدليتك أو مستودعك...">
                    </div>
                </div>
                <div class="gateway-btn-row">
                    <button class="btn-gateway btn-next" onclick="nextGatewayStep(1)">التالي</button>
                </div>
            </div>

            <!-- الخطوة 2 -->
            <div class="gateway-step" id="g-step-2">
                <div class="form-group">
                    <label>رمز التشغيل السريع (Operational Password)</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="input-op-pass" class="gateway-input"
                            placeholder="أدخل الرمز السري التشغيلي...">
                    </div>
                </div>
                <div class="gateway-btn-row">
                    <button class="btn-gateway btn-prev" onclick="prevGatewayStep(2)">السابق</button>
                    <button class="btn-gateway btn-next" onclick="nextGatewayStep(2)">التالي</button>
                </div>
            </div>

            <!-- الخطوة 3 -->
            <div class="gateway-step" id="g-step-3">
                <div class="form-group">
                    <label>المركز الإقليمي المستهدف</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-location-dot"></i>
                        <select id="input-region" class="gateway-select">
                            <option value="حلب وريفها">حلب وريفها</option>
                            <option value="إدلب وريفها">إدلب وريفها</option>
                            <option value="منبج وريفها">منبج وريفها</option>
                        </select>
                    </div>
                </div>
                <div class="gateway-btn-row">
                    <button class="btn-gateway btn-prev" onclick="prevGatewayStep(3)">السابق</button>
                    <button class="btn-gateway btn-next" onclick="nextGatewayStep(3)">التالي</button>
                </div>
            </div>

            <!-- الخطوة 4 -->
            <div class="gateway-step" id="g-step-4">
                <div class="form-group">
                    <label>نوع الحساب الرئيسي</label>
                    <div class="toggle-group">
                        <div class="toggle-option selected" id="type-pharmacist" onclick="setAccountType('pharmacist')">
                            صيدلاني مجتمعي</div>
                        <div class="toggle-option" id="type-warehouse" onclick="setAccountType('warehouse')">صاحب مستودع
                            جملة</div>
                    </div>
                </div>
                <div class="gateway-btn-row">
                    <button class="btn-gateway btn-prev" onclick="prevGatewayStep(4)">السابق</button>
                    <button class="btn-gateway btn-next" style="background-color: var(--feather-teal);"
                        onclick="completeGatewayLogin()">تسجيل الدخول</button>
                </div>
            </div>
        </div>
    </div>

    <!-- المرحلة الثالثة: واجهات العمل المعزولة وشريط التنقل السفلي -->
    <div id="app-screen">
        <header class="app-header">
            <div class="app-header-left">
                <div class="app-header-title" id="app-brand-title">PharmaLink</div>
                <div class="app-header-meta" id="app-header-meta-info">المركز: حلب | الحساب: صيدلاني</div>
            </div>
            <!-- زر تحويل العملات المطور -->
            <div class="currency-switcher">
                <button class="currency-btn active" id="curr-btn-USD" onclick="setCurrency('USD')">USD ($)</button>
                <button class="currency-btn" id="curr-btn-TL" onclick="setCurrency('TL')">TL (₺)</button>
                <button class="currency-btn" id="curr-btn-SYP" onclick="setCurrency('SYP')">SYP (ل.س)</button>
            </div>
        </header>

        <div class="app-content">
            <div id="dynamic-interface-container"></div>
        </div>

        <nav class="bottom-ribbon" id="bottom-ribbon-nav"></nav>
    </div>

    <!-- نافذة منبثقة لإضافة دواء جديد للمستودع -->
    <div class="modal-overlay" id="add-medicine-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>إضافة دواء جديد للمخزون الحي</h3>
                <button class="modal-close-btn" onclick="toggleAddMedicineModal(false)"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="form-group">
                <label>الاسم التجاري للدواء</label>
                <input type="text" id="new-med-name" class="gateway-input" placeholder="مثال: Augmentin 1g">
            </div>
            <div class="form-group">
                <label>التركيب العلمي</label>
                <input type="text" id="new-med-formula" class="gateway-input"
                    placeholder="مثال: Amoxicillin + Clavulanic Acid">
            </div>
            <div class="form-group">
                <label>التصنيف العلاجي</label>
                <select id="new-med-category" class="gateway-select">
                    <option value="مضادات حيوية">مضادات حيوية</option>
                    <option value="مزمن">مزمن</option>
                    <option value="مسكنات">مسكنات</option>
                    <option value="مستهلكات">مستهلكات</option>
                </select>
            </div>
            <div class="form-group">
                <label>السعر الافتراضي بالدولار الأمريكي ($)</label>
                <input type="number" step="0.1" id="new-med-price" class="gateway-input" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>الكمية المتوفرة بالمخزون</label>
                <input type="number" id="new-med-stock" class="gateway-input" placeholder="0">
            </div>
            <button class="btn-wide-checkout" style="background-color: var(--feather-teal);"
                onclick="saveNewMedicine()">حفظ وإضافة للمخزون الحي</button>
        </div>
    </div>

    <script>
        /* === محرك الحالة العالمي ومعادلات الصرف (Global State & Currency Engine) === */
        const AppState = {
            currentStep: 1,
            facilityName: "",
            operationalPass: "",
            region: "حلب وريفها",
            accountType: "pharmacist",
            activeTab: 0,
            activeCurrency: "USD",

            // أسعار الصرف الثابتة المعتمدة
            // 1 USD = 34 TL = 15,000 SYP
            rates: {
                USD: 1,
                TL: 34,
                SYP: 15000
            },
            currencySymbols: {
                USD: "$",
                TL: "₺",
                SYP: "ل.س"
            },

            warehouses: [
                { id: 1, name: "مستودع الألفية الدوائي", region: "حلب وريفها" },
                { id: 2, name: "مستودع الشفاء المركزي", region: "حلب وريفها" },
                { id: 3, name: "مستودع إدلب الطبي", region: "إدلب وريفها" },
                { id: 4, name: "مستودع منبج الإقليمي", region: "منبج وريفها" }
            ],

            // الأسعار المخزنة أساساً بالدولار الأمريكي (Base USD Price)
            medicines: [
                { id: 101, warehouseId: 1, warehouseName: "مستودع الألفية الدوائي", region: "حلب وريفها", name: "Augmentin 1g Tabs", formula: "Amoxicillin / Clavulanate", category: "مضادات حيوية", priceUSD: 12.0, stock: 120 },
                { id: 102, warehouseId: 1, warehouseName: "مستودع الألفية الدوائي", region: "حلب وريفها", name: "Concor 5mg", formula: "Bisoprolol Fumarate", category: "مزمن", priceUSD: 7.5, stock: 15 },
                { id: 103, warehouseId: 2, warehouseName: "مستودع الشفاء المركزي", region: "حلب وريفها", name: "Panadol Extra", formula: "Paracetamol + Caffeine", category: "مسكنات", priceUSD: 4.0, stock: 500 },
                { id: 104, warehouseId: 2, warehouseName: "مستودع الشفاء المركزي", region: "حلب وريفها", name: "Syringe 5ml", formula: "Disposable Medical Device", category: "مستهلكات", priceUSD: 0.8, stock: 8 },
                { id: 105, warehouseId: 3, warehouseName: "مستودع إدلب الطبي", region: "إدلب وريفها", name: "Ceftriaxone 1g", formula: "Ceftriaxone Sodium", category: "مضادات حيوية", priceUSD: 14.0, stock: 80 },
                { id: 106, warehouseId: 4, warehouseName: "مستودع منبج الإقليمي", region: "منبج وريفها", name: "Voltaren 75mg", formula: "Diclofenac Sodium", category: "مسكنات", priceUSD: 8.5, stock: 200 }
            ],

            cart: [],

            orders: [
                { id: "ORD-9021", pharmacyName: "صيدلية النور الحديثة", region: "حلب وريفها", itemsText: "Augmentin 1g (x10), Concor 5mg (x5)", totalCostUSD: 157.5, status: "pending" },
                { id: "ORD-9022", pharmacyName: "صيدلية الرازي", region: "حلب وريفها", itemsText: "Panadol Extra (x50)", totalCostUSD: 200.0, status: "accepted" }
            ],

            stats: {
                totalOrders: 142,
                activeWarehouses: 18,
                financialFlowUSD: 48900
            }
        };

        function formatPrice(priceInUSD) {
            const rate = AppState.rates[AppState.activeCurrency];
            const converted = priceInUSD * rate;
            const symbol = AppState.currencySymbols[AppState.activeCurrency];
            if (AppState.activeCurrency === 'SYP') {
                return `${Math.round(converted).toLocaleString()} ${symbol}`;
            }
            return `${converted.toFixed(2)} ${symbol}`;
        }

        function setCurrency(curr) {
            AppState.activeCurrency = curr;
            document.querySelectorAll('.currency-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`curr-btn-${curr}`).classList.add('active');
            renderActiveTab(AppState.activeTab);
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /* === إدارة التوقيت والتلاشي للشاشة الترحيبية (4.5 ثانية بالضبط) === */
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('gateway-screen').style.display = 'flex';
                }, 800);
            }, 4500);
        });

        function nextGatewayStep(current) {
            if (current === 1) {
                const val = document.getElementById('input-facility-name').value.trim();
                if (!val) { alert("يرجى إدخال اسم المنشأة أو المستخدم."); return; }
                AppState.facilityName = val;
            }
            if (current === 2) {
                const val = document.getElementById('input-op-pass').value.trim();
                if (!val) { alert("يرجى إدخال رمز التشغيل السريع."); return; }
                AppState.operationalPass = val;
            }
            if (current === 3) {
                AppState.region = document.getElementById('input-region').value;
            }

            document.getElementById(`g-step-${current}`).classList.remove('active');
            document.getElementById(`g-step-${current + 1}`).classList.add('active');
        }

        function prevGatewayStep(current) {
            document.getElementById(`g-step-${current}`).classList.remove('active');
            document.getElementById(`g-step-${current - 1}`).classList.add('active');
        }

        function setAccountType(type) {
            AppState.accountType = type;
            if (type === 'pharmacist') {
                document.getElementById('type-pharmacist').classList.add('selected');
                document.getElementById('type-warehouse').classList.remove('selected');
            } else {
                document.getElementById('type-warehouse').classList.add('selected');
                document.getElementById('type-pharmacist').classList.remove('selected');
            }
        }

        function completeGatewayLogin() {
            document.getElementById('gateway-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';

            document.getElementById('app-brand-title').innerText = `PharmaLink - ${AppState.facilityName}`;
            document.getElementById('app-header-meta-info').innerText = `المركز: ${AppState.region} | الدور: ${AppState.accountType === 'pharmacist' ? 'صيدلاني مجتمعي' : 'مستودع جملة'}`;

            renderBottomRibbon();
            renderActiveTab(0);
        }

        function renderBottomRibbon() {
            const ribbon = document.getElementById('bottom-ribbon-nav');
            ribbon.innerHTML = '';

            let tabs = [];
            if (AppState.accountType === 'pharmacist') {
                tabs = [
                    { icon: 'fa-store', label: 'سوق الأدوية' },
                    { icon: 'fa-cart-shopping', label: 'سلة الطلب' },
                    { icon: 'fa-network-wired', label: 'الشبكة' },
                    { icon: 'fa-user-gear', label: 'الحساب' }
                ];
            } else {
                tabs = [
                    { icon: 'fa-boxes-stacked', label: 'مخزوني' },
                    { icon: 'fa-file-invoice-dollar', label: 'الطلبات الواردة' },
                    { icon: 'fa-chart-pie', label: 'الإحصائيات' },
                    { icon: 'fa-user-gear', label: 'الحساب' }
                ];
            }

            tabs.forEach((tab, index) => {
                const btn = document.createElement('button');
                btn.className = `ribbon-item ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `<i class="fa-solid ${tab.icon}"></i><span>${tab.label}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.ribbon-item').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    renderActiveTab(index);
                };
                ribbon.appendChild(btn);
            });
        }

        function renderActiveTab(tabIndex) {
            AppState.activeTab = tabIndex;
            const container = document.getElementById('dynamic-interface-container');
            container.innerHTML = '';

            if (AppState.accountType === 'pharmacist') {
                if (tabIndex === 0) renderPharmacistMarket(container);
                else if (tabIndex === 1) renderPharmacistCart(container);
                else if (tabIndex === 2) renderPharmacistNetwork(container);
                else if (tabIndex === 3) renderAccountView(container);
            } else {
                if (tabIndex === 0) renderWarehouseInventory(container);
                else if (tabIndex === 1) renderWarehouseOrders(container);
                else if (tabIndex === 2) renderWarehouseStats(container);
                else if (tabIndex === 3) renderAccountView(container);
            }
        }

        /* ================= واجهة الصيدلي: 1. سوق الأدوية المطور ================= */
        function renderPharmacistMarket(container) {
            container.innerHTML = `
                <div class="search-filter-bar">
                    <div class="search-input-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="market-search-input" placeholder="ابحث بالاسم التجاري أو التركيب العلمي..." oninput="filterMarketMedicines()">
                    </div>
                </div>
                <div class="filter-chips" id="market-category-chips">
                    <div class="chip active" onclick="setMarketCategory('الكل', this)">الكل</div>
                    <div class="chip" onclick="setMarketCategory('مضادات حيوية', this)">مضادات حيوية</div>
                    <div class="chip" onclick="setMarketCategory('مزمن', this)">مزمن</div>
                    <div class="chip" onclick="setMarketCategory('مسكنات', this)">مسكنات</div>
                    <div class="chip" onclick="setMarketCategory('مستهلكات', this)">مستهلكات</div>
                </div>
                <div style="margin-top: 20px;" class="data-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>اسم الدواء</th>
                                <th>التركيب العلمي</th>
                                <th>المستودع المورد</th>
                                <th>السعر</th>
                                <th>الكمية المتاحة</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="market-table-body"></tbody>
                    </table>
                </div>
            `;
            populateMarketTable();
        }

        let selectedMarketCategory = 'الكل';
        function setMarketCategory(cat, el) {
            selectedMarketCategory = cat;
            document.querySelectorAll('#market-category-chips .chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            populateMarketTable();
        }

        function filterMarketMedicines() {
            populateMarketTable();
        }

        function populateMarketTable() {
            const tbody = document.getElementById('market-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';

            const searchTerm = document.getElementById('market-search-input') ? document.getElementById('market-search-input').value.toLowerCase() : '';

            // العزل الجغرافي الإقليمي الصارم
            const validMeds = AppState.medicines.filter(m => {
                const matchRegion = m.region === AppState.region;
                const matchCat = selectedMarketCategory === 'الكل' || m.category === selectedMarketCategory;
                const matchSearch = m.name.toLowerCase().includes(searchTerm) || m.formula.toLowerCase().includes(searchTerm);
                return matchRegion && matchCat && matchSearch;
            });

            if (validMeds.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--rock-grey);">لا توجد أدوية مطابقة في نطاق مركزك الإقليمي (${AppState.region}).</td></tr>`;
                return;
            }

            validMeds.forEach(med => {
                const stockClass = med.stock > 25 ? 'stock-high' : 'stock-low';
                const stockText = med.stock > 25 ? `${med.stock} (متوفر)` : `${med.stock} (موشك على النفاد)`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${med.name}</strong><br><span style="font-size:11px; color:var(--rock-grey);">${med.category}</span></td>
                    <td>${med.formula}</td>
                    <td><span style="color:var(--feather-teal);">${med.warehouseName}</span></td>
                    <td><strong>${formatPrice(med.priceUSD)}</strong></td>
                    <td><span class="stock-indicator ${stockClass}">${stockText}</span></td>
                    <td><button class="btn-action btn-primary-action" onclick="addToCart(${med.id})"><i class="fa-solid fa-cart-plus"></i> إضافة</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addToCart(medId) {
            const med = AppState.medicines.find(m => m.id === medId);
            if (!med || med.stock <= 0) { alert("عذراً، الدواء غير متوفر حالياً."); return; }

            const existing = AppState.cart.find(item => item.medicineId === medId);
            if (existing) {
                if (existing.quantity < med.stock) {
                    existing.quantity++;
                } else {
                    alert("لقد وصلت للحد الأقصى المتوفر في المخزون.");
                    return;
                }
            } else {
                AppState.cart.push({
                    medicineId: med.id,
                    name: med.name,
                    warehouseName: med.warehouseName,
                    priceUSD: med.priceUSD,
                    quantity: 1,
                    maxStock: med.stock
                });
            }
            showToast(`تمت إضافة "${med.name}" إلى السلة`);
        }

        /* ================= واجهة الصيدلي: 2. سلة الطلب وفاتورة الواتساب ================= */
        function renderPharmacistCart(container) {
            let itemsHtml = '';
            let subtotalUSD = 0;

            if (AppState.cart.length === 0) {
                itemsHtml = `<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--rock-grey);">سلة الطلب فارغة حالياً.</td></tr>`;
            } else {
                AppState.cart.forEach((item, idx) => {
                    const lineTotalUSD = item.priceUSD * item.quantity;
                    subtotalUSD += lineTotalUSD;
                    itemsHtml += `
                        <tr>
                            <td><strong>${item.name}</strong><br><span style="font-size:11px; color:var(--rock-grey);">${item.warehouseName}</span></td>
                            <td>${formatPrice(item.priceUSD)}</td>
                            <td>
                                <input type="number" min="1" max="${item.maxStock}" value="${item.quantity}" style="width:60px; padding:6px; border:2px solid var(--border-color); border-radius:6px; text-align:center; font-weight:900;" onchange="updateCartQty(${idx}, this.value)">
                            </td>
                            <td><strong>${formatPrice(lineTotalUSD)}</strong></td>
                            <td><button class="btn-action btn-secondary-action" onclick="removeFromCart(${idx})"><i class="fa-solid fa-trash"></i></button></td>
                        </tr>
                    `;
                });
            }

            const syndTaxUSD = subtotalUSD * 0.025;
            const grandTotalUSD = subtotalUSD + syndTaxUSD;

            container.innerHTML = `
                <div class="data-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>المادة الدوائية</th>
                                <th>السعر الإفرادي</th>
                                <th>الكمية</th>
                                <th>الإجمالي الفرعي</th>
                                <th>حذف</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                        </tbody>
                    </table>
                </div>

                <div class="cart-summary-box">
                    <div class="cart-summary-row">
                        <span>مجموع المواد:</span>
                        <span>${formatPrice(subtotalUSD)}</span>
                    </div>
                    <div class="cart-summary-row">
                        <span>ضريبة نقابة الأطباء والصيادلة (2.5%):</span>
                        <span>${formatPrice(syndTaxUSD)}</span>
                    </div>
                    <div class="cart-summary-row total">
                        <span>المجموع النهائي المستحق:</span>
                        <span>${formatPrice(grandTotalUSD)}</span>
                    </div>
                    <button class="btn-wide-checkout" onclick="sendWhatsAppInvoice()">
                        <i class="fa-brands fa-whatsapp" style="font-size:20px;"></i> إرسال الطلبيّة ومشاركة الفاتورة عبر WhatsApp
                    </button>
                </div>
            `;
        }

        function updateCartQty(index, val) {
            const qty = parseInt(val);
            if (isNaN(qty) || qty < 1) return;
            if (qty > AppState.cart[index].maxStock) {
                alert("الكمية المطلوبة تتجاوز المخزون المتوفر.");
                renderActiveTab(1);
                return;
            }
            AppState.cart[index].quantity = qty;
            renderActiveTab(1);
        }

        function removeFromCart(index) {
            AppState.cart.splice(index, 1);
            renderActiveTab(1);
        }

        function sendWhatsAppInvoice() {
            if (AppState.cart.length === 0) { alert("السلة فارغة."); return; }

            let subtotalUSD = AppState.cart.reduce((sum, item) => sum + (item.priceUSD * item.quantity), 0);
            let syndTaxUSD = subtotalUSD * 0.025;
            let grandTotalUSD = subtotalUSD + syndTaxUSD;

            let itemsDescription = AppState.cart.map(i => `• ${i.name} (الكمية: ${i.quantity})`).join('\n');

            // خصم الكميات فوراً من المخزون الحي في الذاكرة
            AppState.cart.forEach(cartItem => {
                const med = AppState.medicines.find(m => m.id === cartItem.medicineId);
                if (med) {
                    med.stock -= cartItem.quantity;
                }
            });

            const newOrder = {
                id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
                pharmacyName: AppState.facilityName,
                region: AppState.region,
                itemsText: AppState.cart.map(i => `${i.name} (x${i.quantity})`).join(', '),
                totalCostUSD: grandTotalUSD,
                status: "pending"
            };
            AppState.orders.unshift(newOrder);

            // توليد نص رسالة واتساب الاحترافية
            const message = `*فاتورة طلبية طبية جديدة - PharmaLink* 💊\n\n` +
                `🏥 *الصيدلية المرسلة:* ${AppState.facilityName}\n` +
                `📍 *المركز الإقليمي:* ${AppState.region}\n\n` +
                `📦 *تفاصيل المواد المطلوبة:*\n${itemsDescription}\n\n` +
                `💰 *المجموع النهائي (شامل ضريبة النقابة):* ${formatPrice(grandTotalUSD)}\n\n` +
                `_تم إنشاء هذه الفاتورة الآلية عبر منصة PharmaLink B2B الطبية._`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/?text=${encodedMessage}`;

            AppState.cart = [];
            showToast("تم إرسال الطلبية بنجاح وتحديث المخزون الحي!");

            // فتح رابط الواتساب العميق
            window.open(whatsappUrl, '_blank');
            renderActiveTab(1);
        }

        /* ================= واجهة الصيدلي: 3. الشبكة الإحصائية ================= */
        function renderPharmacistNetwork(container) {
            const flowConverted = AppState.stats.financialFlowUSD * AppState.rates[AppState.activeCurrency];
            const flowDisplay = AppState.activeCurrency === 'SYP' ? `${Math.round(flowConverted).toLocaleString()} ل.س` : `${flowConverted.toFixed(2)} ${AppState.currencySymbols[AppState.activeCurrency]}`;

            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-title">إجمالي الطلبات المنفذة</div>
                        <div class="stat-card-value">${AppState.stats.totalOrders} <span style="font-size:12px; color:#059669;">↑ 12%</span></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-title">المستودعات المتاحة بالمنطقة</div>
                        <div class="stat-card-value">${AppState.stats.activeWarehouses}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-title">حجم التدفقات المالية المحاكاة</div>
                        <div class="stat-card-value">${flowDisplay}</div>
                    </div>
                </div>
                <div class="account-card" style="max-width:100%; text-align:center; padding:40px;">
                    <i class="fa-solid fa-shield-halved" style="font-size:48px; color:var(--feather-teal); margin-bottom:15px;"></i>
                    <h3 style="font-size:20px; font-weight:900;">شبكة PharmaLink الإقليمية المؤمّنة</h3>
                    <p style="color:var(--rock-grey); font-weight:800; margin-top:10px;">عزل بيانات إقليمي مفعل تماماً للمركز: (${AppState.region}).</p>
                </div>
            `;
        }

        /* ================= واجهة المستودع: 1. مخزوني ================= */
        function renderWarehouseInventory(container) {
            container.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="font-weight:900; color:var(--rock-grey);">قائمة أدوية المستودع الحية</h3>
                    <button class="btn-action btn-primary-action" onclick="toggleAddMedicineModal(true)"><i class="fa-solid fa-plus"></i> إضافة دواء جديد</button>
                </div>
                <div class="data-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>الاسم التجاري</th>
                                <th>التركيب العلمي</th>
                                <th>التصنيف</th>
                                <th>السعر</th>
                                <th>الكمية المتوفرة</th>
                            </tr>
                        </thead>
                        <tbody id="warehouse-inv-tbody"></tbody>
                    </table>
                </div>
            `;
            populateWarehouseInventory();
        }

        function populateWarehouseInventory() {
            const tbody = document.getElementById('warehouse-inv-tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const myMeds = AppState.medicines.filter(m => m.region === AppState.region);

            if (myMeds.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--rock-grey);">لا توجد أدوية مسجلة في مخزونك.</td></tr>`;
                return;
            }

            myMeds.forEach(med => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${med.name}</strong></td>
                    <td>${med.formula}</td>
                    <td>${med.category}</td>
                    <td><strong>${formatPrice(med.priceUSD)}</strong></td>
                    <td><span style="color:${med.stock < 25 ? '#991b1b' : 'inherit'}; font-weight:900;">${med.stock} وحدة</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleAddMedicineModal(show) {
            document.getElementById('add-medicine-modal').style.display = show ? 'flex' : 'none';
        }

        function saveNewMedicine() {
            const name = document.getElementById('new-med-name').value.trim();
            const formula = document.getElementById('new-med-formula').value.trim();
            const category = document.getElementById('new-med-category').value;
            const priceUSDInput = parseFloat(document.getElementById('new-med-price').value);
            const stock = parseInt(document.getElementById('new-med-stock').value);

            if (!name || !formula || isNaN(priceUSDInput) || isNaN(stock)) {
                alert("يرجى تعبئة كافة الحقول بدقة.");
                return;
            }

            const newMed = {
                id: Date.now(),
                warehouseId: 99,
                warehouseName: AppState.facilityName,
                region: AppState.region,
                name: name,
                formula: formula,
                category: category,
                priceUSD: priceUSDInput,
                stock: stock
            };

            AppState.medicines.unshift(newMed);
            toggleAddMedicineModal(false);
            showToast("تمت إضافة الدواء بنجاح للمخزون الحي!");
            renderActiveTab(0);
        }

        /* ================= واجهة المستودع: 2. الطلبات الواردة ================= */
        function renderWarehouseOrders(container) {
            let ordersHtml = '';

            if (AppState.orders.length === 0) {
                ordersHtml = `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--rock-grey);">لا توجد طلبات واردة حالياً.</td></tr>`;
            } else {
                AppState.orders.forEach((ord, index) => {
                    let badgeClass = 'status-pending';
                    let statusText = 'قيد الانتظار';
                    if (ord.status === 'accepted') { badgeClass = 'status-accepted'; statusText = 'مقبول ومجهز'; }
                    if (ord.status === 'rejected') { badgeClass = 'status-rejected'; statusText = 'مرفوض'; }

                    ordersHtml += `
                        <tr>
                            <td><strong>${ord.id}</strong></td>
                            <td>${ord.pharmacyName}</td>
                            <td>${ord.region}</td>
                            <td style="font-size:13px; max-width:250px;">${ord.itemsText}</td>
                            <td><strong>${formatPrice(ord.totalCostUSD)}</strong></td>
                            <td>
                                <span class="order-status-badge ${badgeClass}">${statusText}</span>
                                ${ord.status === 'pending' ? `
                                    <div class="btn-status-group" style="margin-top:8px;">
                                        <button class="btn-action btn-accept" onclick="updateOrderStatus(${index}, 'accepted')">قبول وتجهيز</button>
                                        <button class="btn-action btn-reject" onclick="updateOrderStatus(${index}, 'rejected')">رفض</button>
                                    </div>
                                ` : ''}
                            </td>
                        </tr>
                    `;
                });
            }

            container.innerHTML = `
                <div class="data-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>رقم الفاتورة</th>
                                <th>الصيدلية المرسلة</th>
                                <th>المنطقة</th>
                                <th>تفاصيل المواد</th>
                                <th>التكلفة الإجمالية</th>
                                <th>حالة الشحنة والإجراء</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${ordersHtml}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function updateOrderStatus(index, newStatus) {
            AppState.orders[index].status = newStatus;
            showToast(`تم تحديث حالة الطلبية إلى (${newStatus === 'accepted' ? 'مقبول ومجهز' : 'مرفوض'})`);
            renderActiveTab(1);
        }

        function renderWarehouseStats(container) {
            renderPharmacistNetwork(container);
        }

        /* ================= إدارة الحساب والخروج الآمن ================= */
        function renderAccountView(container) {
            container.innerHTML = `
                <div class="account-card">
                    <h3 style="margin-bottom:20px; font-size:20px; font-weight:900; color:var(--rock-grey);">بيانات رخصة المنشأة والاعتماد</h3>
                    <div class="account-row">
                        <span>اسم المنشأة:</span>
                        <span>${AppState.facilityName}</span>
                    </div>
                    <div class="account-row">
                        <span>نوع الحساب:</span>
                        <span>${AppState.accountType === 'pharmacist' ? 'صيدلاني مجتمعي' : 'صاحب مستودع جملة'}</span>
                    </div>
                    <div class="account-row">
                        <span>المركز الإقليمي:</span>
                        <span>${AppState.region}</span>
                    </div>
                    <div class="account-row">
                        <span>حالة الأمان والتشغيل:</span>
                        <span style="color:#059669;">مشفر ونشط (Active 256-bit)</span>
                    </div>
                    <button class="btn-logout" onclick="secureLogout()">تسجيل الخروج الآمن</button>
                </div>
            `;
        }

        function secureLogout() {
            if (confirm("هل أنت متأكد من رغبتك في تسجيل الخروج الآمن وتفريغ ذاكرة الحالة؟")) {
                AppState.cart = [];
                document.getElementById('app-screen').style.display = 'none';
                document.getElementById('gateway-screen').style.display = 'flex';
                document.getElementById('input-facility-name').value = '';
                document.getElementById('input-op-pass').value = '';
                document.getElementById('g-step-4').classList.remove('active');
                document.getElementById('g-step-1').classList.add('active');
            }
        }
    </script>
</body>

</html>
