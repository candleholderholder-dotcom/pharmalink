<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaLink (فارمالينك) - المنصة الطبية المركزية</title>
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --imperial-red: #CC0000;
            --imperial-red-hover: #b30000;
            --slate-gray: #707070;
            --slate-gray-light: #8e8e8e;
            --clinical-white: #FFFFFF;
            --clinical-tint: #F8F9FA;
            --border-color: #E5E7EB;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --success-green: #10B981;
            --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--clinical-tint);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- SPLIT-CAPSULE LOGO --- */
        .split-capsule-logo {
            display: inline-flex;
            width: 80px;
            height: 40px;
            background: var(--clinical-white);
            border-radius: 40px;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06), var(--shadow-subtle);
            overflow: hidden;
            border: 2px solid var(--border-color);
        }

        .split-capsule-logo .right-half {
            width: 50%;
            height: 100%;
            background-color: var(--imperial-red);
            border-top-right-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .split-capsule-logo .left-half {
            width: 50%;
            height: 100%;
            background-color: var(--slate-gray);
            border-top-left-radius: 40px;
            border-bottom-left-radius: 40px;
            position: relative;
        }

        .split-capsule-logo .left-half::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 10px;
            width: 12px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            transform: rotate(-30deg);
        }

        .split-capsule-logo-lg {
            width: 120px;
            height: 60px;
            border-radius: 60px;
            border-width: 3px;
        }

        .split-capsule-logo-lg .right-half {
            border-top-right-radius: 60px;
            border-bottom-right-radius: 60px;
        }

        .split-capsule-logo-lg .left-half {
            border-top-left-radius: 60px;
            border-bottom-left-radius: 60px;
        }

        .split-capsule-logo-lg .left-half::after {
            top: 10px;
            left: 16px;
            width: 18px;
            height: 9px;
            border-radius: 9px;
        }

        /* --- STAGE 1: CINEMATIC SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--clinical-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .splash-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        @keyframes elasticBounce {
            0% {
                transform: scale(0);
            }

            50% {
                transform: scale(1.15);
            }

            70% {
                transform: scale(0.95);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-bounce-in {
            animation: elasticBounce 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .splash-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease 0.4s forwards;
        }

        .splash-title .text-pharma {
            color: var(--slate-gray);
        }

        .splash-title .text-link {
            color: var(--imperial-red);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- STAGE 2: MULTI-STEP CREDENTIALS GATEWAY --- */
        #gateway-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #F8F9FA 0%, #E9ECEF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 8888;
            padding: 20px;
            transition: opacity 0.6s ease;
        }

        #gateway-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gateway-card {
            background: var(--clinical-white);
            width: 100%;
            max-width: 540px;
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            padding: 40px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .gateway-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .gateway-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 15px;
        }

        .gateway-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Progress Dots */
        .wizard-progress {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .progress-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--border-color);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition-smooth);
        }

        .progress-dot.active {
            background: var(--imperial-red);
            color: var(--clinical-white);
            box-shadow: 0 0 10px rgba(204, 0, 0, 0.3);
        }

        .progress-dot.completed {
            background: var(--success-green);
            color: var(--clinical-white);
        }

        /* Step Panels */
        .wizard-step {
            display: none;
            animation: fadeInStep 0.4s ease;
        }

        .wizard-step.active {
            display: block;
        }

        @keyframes fadeInStep {
            from {
                opacity: 0;
                transform: translateX(15px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--slate-gray);
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: var(--clinical-tint);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: var(--transition-smooth);
        }

        .form-control:focus {
            border-color: var(--imperial-red);
            background: var(--clinical-white);
            box-shadow: 0 0 0 4px rgba(204, 0, 0, 0.08);
        }

        select.form-control {
            padding-right: 45px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23707070' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 15px center;
            background-size: 16px;
        }

        /* Role Selector Cards */
        .role-cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .role-card {
            background: var(--clinical-tint);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .role-card i {
            font-size: 2.2rem;
            color: var(--slate-gray);
            margin-bottom: 12px;
            transition: var(--transition-smooth);
        }

        .role-card h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .role-card:hover {
            border-color: var(--slate-gray-light);
            background: var(--clinical-white);
        }

        .role-card.selected {
            border-color: var(--imperial-red);
            background: rgba(204, 0, 0, 0.02);
        }

        .role-card.selected i {
            color: var(--imperial-red);
        }

        /* Wizard Footer Actions */
        .gateway-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary {
            background: var(--clinical-tint);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--imperial-red);
            color: var(--clinical-white);
            box-shadow: 0 4px 12px rgba(204, 0, 0, 0.25);
        }

        .btn-primary:hover {
            background: var(--imperial-red-hover);
            box-shadow: 0 6px 15px rgba(204, 0, 0, 0.35);
        }

        .btn-success {
            background: var(--success-green);
            color: var(--clinical-white);
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        /* --- STAGE 3: MAIN APP LAYOUT --- */
        #app-container {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: var(--clinical-tint);
        }

        #app-container.active {
            display: flex;
        }

        /* Top Header */
        .app-header {
            background: var(--clinical-white);
            height: 70px;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-subtle);
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-brand-text h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .header-brand-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-facility {
            background: rgba(204, 0, 0, 0.08);
            color: var(--imperial-red);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(204, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-region {
            background: var(--clinical-tint);
            color: var(--slate-gray);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        /* Scrollable Content Arena */
        .app-content-arena {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            padding-bottom: 100px;
            /* Leave space for bottom ribbon */
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .workspace-tab-content {
            display: none;
            animation: fadeInWorkspace 0.3s ease;
        }

        .workspace-tab-content.active {
            display: block;
        }

        @keyframes fadeInWorkspace {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Bottom Ribbon Navigation */
        .app-bottom-ribbon {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--clinical-white);
            height: 75px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06);
            z-index: 1000;
            padding: 0 10px;
        }

        .ribbon-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition-smooth);
            height: 100%;
            position: relative;
        }

        .ribbon-item i {
            font-size: 1.3rem;
            transition: var(--transition-smooth);
        }

        .ribbon-item span {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .ribbon-item:hover {
            color: var(--imperial-red);
        }

        .ribbon-item.active {
            color: var(--imperial-red);
        }

        .ribbon-item.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 3px;
            background: var(--imperial-red);
            border-radius: 0 0 3px 3px;
        }

        /* Cart Badge on Ribbon */
        .cart-badge-count {
            position: absolute;
            top: 10px;
            right: 28%;
            background: var(--imperial-red);
            color: white;
            font-size: 0.65rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* --- DASHBOARD COMPONENTS & CARDS --- */
        .card-container {
            background: var(--clinical-white);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-subtle);
            padding: 25px;
            margin-bottom: 25px;
        }

        .section-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--imperial-red);
        }

        /* Marketplace Filter Pills */
        .filter-pills-wrapper {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .filter-pill {
            padding: 8px 16px;
            background: var(--clinical-white);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition-smooth);
        }

        .filter-pill:hover {
            border-color: var(--slate-gray-light);
            color: var(--text-main);
        }

        .filter-pill.active {
            background: var(--imperial-red);
            border-color: var(--imperial-red);
            color: var(--clinical-white);
            box-shadow: 0 4px 10px rgba(204, 0, 0, 0.2);
        }

        /* Search Bar */
        .search-bar-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-bar-container i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--slate-gray);
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: var(--clinical-white);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .search-input:focus {
            border-color: var(--imperial-red);
            box-shadow: 0 0 0 4px rgba(204, 0, 0, 0.08);
        }

        /* Data Tables */
        .table-responsive {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.9rem;
        }

        .data-table th {
            background: var(--clinical-tint);
            color: var(--text-muted);
            font-weight: 700;
            padding: 14px 16px;
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
        }

        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            vertical-align: middle;
        }

        .data-table tr:hover td {
            background: rgba(0, 0, 0, 0.01);
        }

        /* Quantity Stepper */
        .qty-stepper {
            display: inline-flex;
            align-items: center;
            background: var(--clinical-tint);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .qty-btn {
            background: transparent;
            border: none;
            width: 30px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            font-weight: bold;
            transition: var(--transition-smooth);
        }

        .qty-btn:hover {
            background: var(--border-color);
            color: var(--imperial-red);
        }

        .qty-val {
            width: 35px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* Analytics Grid */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .metric-card {
            background: var(--clinical-white);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 22px;
            box-shadow: var(--shadow-subtle);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .metric-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: rgba(204, 0, 0, 0.08);
            color: var(--imperial-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .metric-info span {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .metric-info h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 4px;
        }

        /* Invoice Breakdown Card */
        .invoice-card {
            background: var(--clinical-white);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--shadow-subtle);
        }

        .invoice-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .invoice-row.total-row {
            border-bottom: none;
            padding-top: 18px;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--imperial-red);
        }

        /* Request Tracking Cards */
        .request-card {
            background: var(--clinical-white);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .request-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .request-pharmacy-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 750;
        }

        .status-pending {
            background: #FEF3C7;
            color: #D97706;
        }

        .status-accepted {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-rejected {
            background: #FEE2E2;
            color: #991B1B;
        }

        .request-items-summary {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--clinical-tint);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .request-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        /* Modal Popup Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--clinical-white);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-card);
            transform: scale(0.95);
            transition: var(--transition-smooth);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .modal-close-btn:hover {
            color: var(--imperial-red);
        }

        /* Account Hub Profile Card */
        .profile-card {
            text-align: center;
            padding: 30px;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(204, 0, 0, 0.1);
            color: var(--imperial-red);
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            border: 2px solid rgba(204, 0, 0, 0.2);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .gateway-card {
                padding: 25px;
            }

            .role-cards-grid {
                grid-template-columns: 1fr;
            }

            .app-content-arena {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- STAGE 1: CINEMATIC VISUAL SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="split-capsule-logo split-capsule-logo-lg animate-bounce-in">
                <div class="right-half"></div>
                <div class="left-half"></div>
            </div>
            <h1 class="splash-title">
                <span class="text-pharma">Pharma</span><span class="text-link">Link</span>
            </h1>
        </div>
    </div>

    <!-- STAGE 2: MULTI-STEP CREDENTIALS GATEWAY -->
    <div id="gateway-container">
        <div class="gateway-card">
            <div class="gateway-header">
                <div class="split-capsule-logo" style="margin: 0 auto;">
                    <div class="right-half"></div>
                    <div class="left-half"></div>
                </div>
                <h2>غرفة تعبئة معلومات المنصة</h2>
                <p>يرجى إدخال بيانات الاعتماد والمنطقة للوصول إلى شبكة التوزيع الطبية</p>
            </div>

            <!-- Progress Indicator Dots -->
            <div class="wizard-progress">
                <div class="progress-dot active" id="p-dot-1">1</div>
                <div class="progress-dot" id="p-dot-2">2</div>
                <div class="progress-dot" id="p-dot-3">3</div>
                <div class="progress-dot" id="p-dot-4">4</div>
            </div>

            <form id="credentials-wizard-form" onsubmit="return false;">
                <!-- Step 1: Facility Name -->
                <div class="wizard-step active" id="wizard-step-1">
                    <div class="form-group">
                        <label class="form-label">اسم المنشأة الطبية / الصيدلية / المستودع</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-hospital"></i>
                            <input type="text" id="input-facility-name" class="form-control"
                                placeholder="أدخل اسم المنشأة (مثال: صيدلية النور المركزية)" required>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Operational Password -->
                <div class="wizard-step" id="wizard-step-2">
                    <div class="form-group">
                        <label class="form-label">رمز التشغيل السريع (كلمة المرور الآمنة)</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-shield-halved"></i>
                            <input type="password" id="input-password" class="form-control"
                                placeholder="أدخل رمز التشغيل السريع" required>
                        </div>
                    </div>
                </div>

                <!-- Step 3: Regional Distribution Hub -->
                <div class="wizard-step" id="wizard-step-3">
                    <div class="form-group">
                        <label class="form-label">اختر مركز التوزيع الإقليمي المستهدف</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-map-location-dot"></i>
                            <select id="input-region" class="form-control" required>
                                <option value="حلب وريفها">حلب وريفها</option>
                                <option value="إدلب وريفها">إدلب وريفها</option>
                                <option value="منبج وريفها">منبج وريفها</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Step 4: Account Role Selector -->
                <div class="wizard-step" id="wizard-step-4">
                    <div class="form-group">
                        <label class="form-label">اختر دور الحساب والصلاحيات</label>
                        <div class="role-cards-grid">
                            <div class="role-card selected" onclick="AppState.setRole('pharmacist')"
                                id="role-card-pharmacist">
                                <i class="fa-solid fa-mortar-pestle"></i>
                                <h4>صيدلاني</h4>
                            </div>
                            <div class="role-card" onclick="AppState.setRole('supplier')" id="role-card-supplier">
                                <i class="fa-solid fa-warehouse"></i>
                                <h4>صاحب مستودع</h4>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer Navigation Buttons -->
                <div class="gateway-footer">
                    <button type="button" class="btn btn-secondary" id="btn-prev-step" onclick="AppState.prevStep()"
                        style="visibility: hidden;">
                        <i class="fa-solid fa-arrow-right"></i> السابق
                    </button>
                    <button type="button" class="btn btn-primary" id="btn-next-step" onclick="AppState.nextStep()">
                        التالي <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- STAGE 3: ISOLATED APP WORKSPACES -->
    <div id="app-container">
        <!-- Fixed Top Header -->
        <header class="app-header">
            <div class="header-brand">
                <div class="split-capsule-logo" style="width: 50px; height: 26px;">
                    <div class="right-half"></div>
                    <div class="left-half"></div>
                </div>
                <div class="header-brand-text">
                    <h1>PharmaLink</h1>
                    <span>منصة الإمداد الطبي الموحدة</span>
                </div>
            </div>
            <div class="header-meta">
                <div class="badge-facility" id="header-display-facility">
                    <i class="fa-solid fa-building-user"></i> <span id="span-facility-name">صيدلية النور</span>
                </div>
                <div class="badge-region" id="header-display-region">
                    حلب وريفها
                </div>
            </div>
        </header>

        <!-- Dynamic Scrollable Content Arena -->
        <main class="app-content-arena" id="app-content-arena">
            <!-- Workspace contents will be dynamically injected or toggled here based on role -->
        </main>

        <!-- Smartphone-Style Bottom Ribbon Navigation -->
        <nav class="app-bottom-ribbon" id="app-bottom-ribbon">
            <!-- Ribbon items will be populated dynamically based on active role -->
        </nav>
    </div>

    <!-- Modal for Adding New Medicine (Supplier Hub) -->
    <div class="modal-overlay" id="modal-add-medicine">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="section-title"><i class="fa-solid fa-pills"></i> إضافة مادة دوائية جديدة</h3>
                <button class="modal-close-btn" onclick="AppState.closeModal()"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-medicine-form" onsubmit="AppState.submitNewMedicine(event);">
                <div class="form-group">
                    <label class="form-label">الاسم التجاري للمادة (Trade Name)</label>
                    <input type="text" id="new-med-name" class="form-control" placeholder="مثال: Augmentin 1g" required>
                </div>
                <div class="form-group">
                    <label class="form-label">التصنيف الدوائي</label>
                    <select id="new-med-category" class="form-control" required>
                        <option value="مضادات حيوية">مضادات حيوية</option>
                        <option value="أدوية مزمنة">أدوية مزمنة</option>
                        <option value="مسكنات آلام">مسكنات آلام</option>
                        <option value="مستهلكات طبية">مستهلكات طبية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">السعر (ليرة سورية)</label>
                    <input type="number" id="new-med-price" class="form-control" placeholder="مثال: 15000" min="100"
                        required>
                </div>
                <div class="form-group">
                    <label class="form-label">الكمية المتوفرة في المخزون</label>
                    <input type="number" id="new-med-stock" class="form-control" placeholder="مثال: 500" min="1"
                        required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="AppState.closeModal()">إلغاء</button>
                    <button type="submit" class="btn btn-primary">حفظ وإضافة للمخزون</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CORE JAVASCRIPT STATE ENGINE & APPLICATION LOGIC -->
    <script>
        // --- GLOBAL STATE ENGINE ---
        const AppState = {
            currentStep: 1,
            userMetadata: {
                facilityName: '',
                password: '',
                region: 'حلب وريفها',
                role: 'pharmacist' // 'pharmacist' or 'supplier'
            },
            activeTab: 'marketplace', // active workspace tab
            selectedCategoryFilter: 'الكل',
            searchQuery: '',

            // Live Mock Medical Database Array across regions
            medications: [
                { id: 1, tradeName: 'Augmentin 1g Tablets', category: 'مضادات حيوية', price: 18500, stock: 450, supplierName: 'مستودع الألفية الطبي', region: 'حلب وريفها' },
                { id: 2, tradeName: 'Panadol Extra 500mg', category: 'مسكنات آلام', price: 4200, stock: 1200, supplierName: 'مستودع الشفاء الدوائي', region: 'حلب وريفها' },
                { id: 3, tradeName: 'Concor 5mg', category: 'أدوية مزمنة', price: 9800, stock: 320, supplierName: 'مستودع الألفية الطبي', region: 'حلب وريفها' },
                { id: 4, tradeName: 'Syringe 5ml Disposable', category: 'مستهلكات طبية', price: 1200, stock: 5000, supplierName: 'مستودع الرازي الطبي', region: 'حلب وريفها' },
                { id: 5, tradeName: 'Ceftriaxone 1g Vial', category: 'مضادات حيوية', price: 7500, stock: 800, supplierName: 'مستودع إدلب المركزي', region: 'إدلب وريفها' },
                { id: 6, tradeName: 'Brufen 400mg', category: 'مسكنات آلام', price: 5600, stock: 600, supplierName: 'مستودع الفرات الدوائي', region: 'منبج وريفها' }
            ],

            // Shopping Cart Data Structure
            cart: [], // { medId, quantity }

            // Incoming Requests Queue Array
            requestsQueue: [
                { id: 101, pharmacyName: 'صيدلية الياسمين', itemsSummary: 'Augmentin 1g (×10), Panadol Extra (×25)', netCost: 290000, status: 'pending', region: 'حلب وريفها' },
                { id: 102, pharmacyName: 'صيدلية ابن سينا', itemsSummary: 'Concor 5mg (×15)', netCost: 149940, status: 'accepted', region: 'حلب وريفها' }
            ],

            // --- INITIALIZATION ---
            init() {
                // Handle cinematic splash screen timeout
                setTimeout(() => {
                    const splash = document.getElementById('splash-screen');
                    if (splash) splash.classList.add('fade-out');
                }, 3500);
            },

            // --- WIZARD NAVIGATION (STAGE 2) ---
            nextStep() {
                if (this.currentStep === 1) {
                    const val = document.getElementById('input-facility-name').value.trim();
                    if (!val) { alert('يرجى إدخال اسم المنشأة الطبية'); return; }
                    this.userMetadata.facilityName = val;
                } else if (this.currentStep === 2) {
                    const val = document.getElementById('input-password').value.trim();
                    if (!val) { alert('يرجى إدخال رمز التشغيل السريع'); return; }
                    this.userMetadata.password = val;
                } else if (this.currentStep === 3) {
                    const val = document.getElementById('input-region').value;
                    this.userMetadata.region = val;
                }

                if (this.currentStep < 4) {
                    this.currentStep++;
                    this.updateWizardUI();
                } else {
                    // Final submission of gateway
                    this.launchAppWorkspace();
                }
            },

            prevStep() {
                if (this.currentStep > 1) {
                    this.currentStep--;
                    this.updateWizardUI();
                }
            },

            updateWizardUI() {
                for (let i = 1; i <= 4; i++) {
                    const stepEl = document.getElementById(`wizard-step-${i}`);
                    const dotEl = document.getElementById(`p-dot-${i}`);
                    if (i === this.currentStep) {
                        stepEl.classList.add('active');
                        dotEl.classList.add('active');
                        dotEl.classList.remove('completed');
                    } else if (i < this.currentStep) {
                        stepEl.classList.remove('active');
                        dotEl.classList.remove('active');
                        dotEl.classList.add('completed');
                    } else {
                        stepEl.classList.remove('active');
                        dotEl.classList.remove('active');
                        dotEl.classList.remove('completed');
                    }
                }
                const prevBtn = document.getElementById('btn-prev-step');
                const nextBtn = document.getElementById('btn-next-step');

                prevBtn.style.visibility = (this.currentStep === 1) ? 'hidden' : 'visible';
                if (this.currentStep === 4) {
                    nextBtn.innerHTML = 'تسجيل الدخول <i class="fa-solid fa-check"></i>';
                    nextBtn.className = 'btn btn-success';
                } else {
                    nextBtn.innerHTML = 'التالي <i class="fa-solid fa-arrow-left"></i>';
                    nextBtn.className = 'btn btn-primary';
                }
            },

            setRole(role) {
                this.userMetadata.role = role;
                document.getElementById('role-card-pharmacist').classList.toggle('selected', role === 'pharmacist');
                document.getElementById('role-card-supplier').classList.toggle('selected', role === 'supplier');
            },

            // --- APP LAUNCH ---
            launchAppWorkspace() {
                const gateway = document.getElementById('gateway-container');
                const appContainer = document.getElementById('app-container');

                gateway.classList.add('hidden');
                appContainer.classList.add('active');

                // Update Header Metadata
                document.getElementById('span-facility-name').innerText = this.userMetadata.facilityName;
                document.getElementById('header-display-region').innerText = this.userMetadata.region;

                // Set initial default tab depending on role
                if (this.userMetadata.role === 'pharmacist') {
                    this.activeTab = 'marketplace';
                } else {
                    this.activeTab = 'stock';
                }

                this.renderWorkspace();
            },

            // --- RENDER WORKSPACE ARCHITECTURE ---
            renderWorkspace() {
                this.renderBottomRibbon();
                this.renderActiveTabContent();
            },

            renderBottomRibbon() {
                const ribbon = document.getElementById('app-bottom-ribbon');
                let html = '';

                if (this.userMetadata.role === 'pharmacist') {
                    const cartCount = this.cart.reduce((sum, item) => sum + item.quantity, 0);
                    html = `
                        <button class="ribbon-item ${this.activeTab === 'marketplace' ? 'active' : ''}" onclick="AppState.switchTab('marketplace')">
                            <i class="fa-solid fa-store"></i>
                            <span>سوق الأدوية</span>
                        </button>
                        <button class="ribbon-item ${this.activeTab === 'cart' ? 'active' : ''}" onclick="AppState.switchTab('cart')">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span>سلة الطلب</span>
                            ${cartCount > 0 ? `<div class="cart-badge-count">${cartCount}</div>` : ''}
                        </button>
                        <button class="ribbon-item ${this.activeTab === 'analytics' ? 'active' : ''}" onclick="AppState.switchTab('analytics')">
                            <i class="fa-solid fa-chart-line"></i>
                            <span>الشبكة</span>
                        </button>
                        <button class="ribbon-item ${this.activeTab === 'account' ? 'active' : ''}" onclick="AppState.switchTab('account')">
                            <i class="fa-solid fa-user-gear"></i>
                            <span>الحساب</span>
                        </button>
                    `;
                } else {
                    // Supplier Hub Ribbon
                    const pendingCount = this.requestsQueue.filter(r => r.region === this.userMetadata.region && r.status === 'pending').length;
                    html = `
                        <button class="ribbon-item ${this.activeTab === 'stock' ? 'active' : ''}" onclick="AppState.switchTab('stock')">
                            <i class="fa-solid fa-boxes-stacked"></i>
                            <span>مخزوني</span>
                        </button>
                        <button class="ribbon-item ${this.activeTab === 'requests' ? 'active' : ''}" onclick="AppState.switchTab('requests')">
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                            <span>الطلبات الواردة</span>
                            ${pendingCount > 0 ? `<div class="cart-badge-count">${pendingCount}</div>` : ''}
                        </button>
                        <button class="ribbon-item ${this.activeTab === 'analytics' ? 'active' : ''}" onclick="AppState.switchTab('analytics')">
                            <i class="fa-solid fa-chart-line"></i>
                            <span>الشبكة</span>
                        </button>
                        <button class="ribbon-item ${this.activeTab === 'account' ? 'active' : ''}" onclick="AppState.switchTab('account')">
                            <i class="fa-solid fa-user-gear"></i>
                            <span>الحساب</span>
                        </button>
                    `;
                }
                ribbon.innerHTML = html;
            },

            switchTab(tabName) {
                this.activeTab = tabName;
                this.renderWorkspace();
            },

            renderActiveTabContent() {
                const arena = document.getElementById('app-content-arena');
                let html = '';

                if (this.userMetadata.role === 'pharmacist') {
                    if (this.activeTab === 'marketplace') {
                        html = this.renderPharmacistMarketplace();
                    } else if (this.activeTab === 'cart') {
                        html = this.renderPharmacistCart();
                    } else if (this.activeTab === 'analytics') {
                        html = this.renderSharedAnalytics();
                    } else if (this.activeTab === 'account') {
                        html = this.renderAccountHub();
                    }
                } else {
                    // Supplier Hub
                    if (this.activeTab === 'stock') {
                        html = this.renderSupplierStock();
                    } else if (this.activeTab === 'requests') {
                        html = this.renderSupplierRequests();
                    } else if (this.activeTab === 'analytics') {
                        html = this.renderSharedAnalytics();
                    } else if (this.activeTab === 'account') {
                        html = this.renderAccountHub();
                    }
                }

                arena.innerHTML = `<div class="workspace-tab-content active">${html}</div>`;
            },

            // --- VIEW A: PHARMACIST WORKSPACE TABS ---
            renderPharmacistMarketplace() {
                const categories = ['الكل', 'مضادات حيوية', 'أدوية مزمنة', 'مسكنات آلام', 'مستهلكات طبية'];

                // SECURITY & REGIONAL RULE: Show only wholesale stock lines belonging to warehouses in the region selected during step 3
                const regionMeds = this.medications.filter(m => m.region === this.userMetadata.region);

                const filteredMeds = regionMeds.filter(m => {
                    const matchesCat = (this.selectedCategoryFilter === 'الكل' || m.category === this.selectedCategoryFilter);
                    const matchesSearch = m.tradeName.toLowerCase().includes(this.searchQuery.toLowerCase()) || m.supplierName.toLowerCase().includes(this.searchQuery.toLowerCase());
                    return matchesCat && matchesSearch;
                });

                let pillsHtml = categories.map(cat => `
                    <div class="filter-pill ${this.selectedCategoryFilter === cat ? 'active' : ''}" onclick="AppState.setCategoryFilter('${cat}')">${cat}</div>
                `).join('');

                let rowsHtml = '';
                if (filteredMeds.length === 0) {
                    rowsHtml = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">لا توجد مواد مطابقة في مركز التوزيع الإقليمي الحالي (${this.userMetadata.region})</td></tr>`;
                } else {
                    rowsHtml = filteredMeds.map(med => {
                        const cartItem = this.cart.find(c => c.medId === med.id);
                        const qty = cartItem ? cartItem.quantity : 0;
                        return `
                            <tr>
                                <td><strong>${med.tradeName}</strong></td>
                                <td><span class="badge-region" style="font-size: 0.75rem;">${med.category}</span></td>
                                <td><span style="font-weight: 700; color: var(--imperial-red);">${med.price.toLocaleString()} ل.س</span></td>
                                <td>${med.stock} وحدة</td>
                                <td style="color: var(--text-muted); font-size: 0.85rem;"><i class="fa-solid fa-warehouse"></i> ${med.supplierName}</td>
                                <td>
                                    <div class="qty-stepper">
                                        <button class="qty-btn" onclick="AppState.updateCartQty(${med.id}, -1)">-</button>
                                        <div class="qty-val">${qty}</div>
                                        <button class="qty-btn" onclick="AppState.updateCartQty(${med.id}, 1)">+</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }).join('');
                }

                return `
                    <div class="card-container">
                        <div class="section-header-flex">
                            <h2 class="section-title"><i class="fa-solid fa-store"></i> سوق الأدوية المعتمد (${this.userMetadata.region})</h2>
                        </div>
                        
                        <div class="search-bar-container">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" class="search-input" placeholder="ابحث بالاسم التجاري للدواء أو اسم المستودع..." value="${this.searchQuery}" onkeyup="AppState.handleSearchKeyup(event)">
                        </div>

                        <div class="filter-pills-wrapper">
                            ${pillsHtml}
                        </div>

                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>الاسم التجاري</th>
                                        <th>التصنيف</th>
                                        <th>السعر الإفرادي</th>
                                        <th>المخزون المتوفر</th>
                                        <th>المستودع المزود</th>
                                        <th>الطلب المباشر</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            setCategoryFilter(cat) {
                this.selectedCategoryFilter = cat;
                this.renderActiveTabContent();
            },

            handleSearchKeyup(e) {
                this.searchQuery = e.target.value;
                this.renderActiveTabContent();
            },

            updateCartQty(medId, delta) {
                const med = this.medications.find(m => m.id === medId);
                if (!med) return;

                let existing = this.cart.find(c => c.medId === medId);
                if (existing) {
                    existing.quantity += delta;
                    if (existing.quantity > med.stock) {
                        existing.quantity = med.stock;
                        alert('عذراً، الكمية المطلوبة تتجاوز المخزون المتوفر لدى المستودع.');
                    }
                    if (existing.quantity <= 0) {
                        this.cart = this.cart.filter(c => c.medId !== medId);
                    }
                } else if (delta > 0) {
                    if (med.stock > 0) {
                        this.cart.push({ medId: med.id, quantity: 1 });
                    } else {
                        alert('المادة غير متوفرة حالياً في المخزون.');
                    }
                }
                this.renderWorkspace();
            },

            renderPharmacistCart() {
                if (this.cart.length === 0) {
                    return `
                        <div class="card-container" style="text-align: center; padding: 50px 20px;">
                            <i class="fa-solid fa-cart-shopping" style="font-size: 3.5rem; color: var(--border-color); margin-bottom: 20px;"></i>
                            <h3 style="font-size: 1.2rem; color: var(--text-main); margin-bottom: 10px;">سلة الطلبات فارغة تماماً</h3>
                            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">قم بزيارة سوق الأدوية لإضافة المواد الطبية المطلوبة لصيدليتك.</p>
                            <button class="btn btn-primary" onclick="AppState.switchTab('marketplace')">الانتقال إلى سوق الأدوية</button>
                        </div>
                    `;
                }

                let subtotal = 0;
                let rowsHtml = this.cart.map(item => {
                    const med = this.medications.find(m => m.id === item.medId);
                    const itemTotal = med.price * item.quantity;
                    subtotal += itemTotal;
                    return `
                        <tr>
                            <td><strong>${med.tradeName}</strong></td>
                            <td>${med.price.toLocaleString()} ل.س</td>
                            <td>
                                <div class="qty-stepper">
                                    <button class="qty-btn" onclick="AppState.updateCartQty(${med.id}, -1)">-</button>
                                    <div class="qty-val">${item.quantity}</div>
                                    <button class="qty-btn" onclick="AppState.updateCartQty(${med.id}, 1)">+</button>
                                </div>
                            </td>
                            <td><strong style="color: var(--imperial-red);">${itemTotal.toLocaleString()} ل.س</strong></td>
                            <td><button class="btn-secondary" style="padding: 6px 10px; font-size: 0.8rem; border-radius: 6px;" onclick="AppState.removeCartItem(${med.id})"><i class="fa-solid fa-trash"></i></button></td>
                        </tr>
                    `;
                }).join('');

                const syndicalTax = subtotal * 0.02; // 2% medical tax
                const netTotal = subtotal + syndicalTax;

                return `
                    <div style="display: grid; grid-template-columns: 1fr; gap: 25px;">
                        <div class="card-container">
                            <div class="section-header-flex">
                                <h2 class="section-title"><i class="fa-solid fa-cart-shopping"></i> سلة الطلب الحالية</h2>
                                <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 6px 12px;" onclick="AppState.clearCart()">إفرام السلة بالكامل</button>
                            </div>
                            <div class="table-responsive">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>المادة الطبية</th>
                                            <th>السعر الإفرادي</th>
                                            <th>الكمية</th>
                                            <th>المجموع الجزئي</th>
                                            <th>إدارة</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rowsHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="invoice-card">
                            <h3 class="section-title" style="margin-bottom: 15px;"><i class="fa-solid fa-file-invoice"></i> ملخص الفاتورة والضرائب</h3>
                            <div class="invoice-row">
                                <span>مجموع قيم المواد المطلوبة:</span>
                                <strong>${subtotal.toLocaleString()} ل.س</strong>
                            </div>
                            <div class="invoice-row">
                                <span>الرسوم النقابية الطبية (2%):</span>
                                <strong>${syndicalTax.toLocaleString()} ل.س</strong>
                            </div>
                            <div class="invoice-row total-row">
                                <span>الصافي الإجمالي الواجب سداده:</span>
                                <span>${netTotal.toLocaleString()} ل.س</span>
                            </div>
                            <div style="margin-top: 25px;">
                                <button class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.05rem;" onclick="AppState.dispatchOrder()">
                                    <i class="fa-solid fa-paper-plane"></i> إرسال الطلبيّة للمستودعات بشكل فوري
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            removeCartItem(medId) {
                this.cart = this.cart.filter(c => c.medId !== medId);
                this.renderWorkspace();
            },

            clearCart() {
                this.cart = [];
                this.renderWorkspace();
            },

            dispatchOrder() {
                if (this.cart.length === 0) return;

                let itemsSummaryStr = this.cart.map(item => {
                    const med = this.medications.find(m => m.id === item.medId);
                    return `${med.tradeName} (×${item.quantity})`;
                }).join(', ');

                let subtotal = this.cart.reduce((sum, item) => {
                    const med = this.medications.find(m => m.id === item.medId);
                    return sum + (med.price * item.quantity);
                }, 0);
                let netTotal = subtotal * 1.02;

                const newOrder = {
                    id: Date.now(),
                    pharmacyName: this.userMetadata.facilityName,
                    itemsSummary: itemsSummaryStr,
                    netCost: Math.round(netTotal),
                    status: 'pending',
                    region: this.userMetadata.region
                };

                // Inject into incoming requests queue
                this.requestsQueue.unshift(newOrder);

                // Flush cart
                this.cart = [];

                alert('تم إرسال الطلبية بنجاح إلى شبكة المستودعات الإقليمية المعتمدة!');
                this.switchTab('marketplace');
            },

            // --- VIEW B: WHOLESALE WAREHOUSE SUPPLIER HUB TABS ---
            renderSupplierStock() {
                const supplierRegionMeds = this.medications.filter(m => m.region === this.userMetadata.region);

                let rowsHtml = '';
                if (supplierRegionMeds.length === 0) {
                    rowsHtml = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">لا توجد مواد مسجلة في مخزون المستودع الخاص بك. أضف مادة جديدة الآن.</td></tr>`;
                } else {
                    rowsHtml = supplierRegionMeds.map(med => `
                        <tr>
                            <td><strong>${med.tradeName}</strong></td>
                            <td><span class="badge-region" style="font-size: 0.75rem;">${med.category}</span></td>
                            <td><span style="font-weight: 700; color: var(--imperial-red);">${med.price.toLocaleString()} ل.س</span></td>
                            <td><strong>${med.stock} وحدة</strong></td>
                            <td>
                                <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem; border-radius: 6px;" onclick="AppState.deleteStockItem(${med.id})">
                                    <i class="fa-solid fa-trash"></i> حذف
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }

                return `
                    <div class="card-container">
                        <div class="section-header-flex">
                            <h2 class="section-title"><i class="fa-solid fa-boxes-stacked"></i> سجل مخزون مستودع التوزيع (${this.userMetadata.region})</h2>
                            <button class="btn btn-primary" style="font-size: 0.9rem;" onclick="AppState.openModal()">
                                <i class="fa-solid fa-plus"></i> إضافة مادة دوائية جديدة
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>الاسم التجاري</th>
                                        <th>التصنيف</th>
                                        <th>السعر (ل.س)</th>
                                        <th>الكمية بالمخزون</th>
                                        <th>الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            openModal() {
                document.getElementById('modal-add-medicine').classList.add('active');
            },

            closeModal() {
                document.getElementById('modal-add-medicine').classList.remove('active');
            },

            submitNewMedicine(e) {
                e.preventDefault();
                const name = document.getElementById('new-med-name').value.trim();
                const cat = document.getElementById('new-med-category').value;
                const price = parseFloat(document.getElementById('new-med-price').value);
                const stock = parseInt(document.getElementById('new-med-stock').value);

                if (!name || isNaN(price) || isNaN(stock)) return;

                const newMed = {
                    id: Date.now(),
                    tradeName: name,
                    category: cat,
                    price: price,
                    stock: stock,
                    supplierName: this.userMetadata.facilityName,
                    region: this.userMetadata.region
                };

                this.medications.unshift(newMed);
                this.closeModal();
                document.getElementById('add-medicine-form').reset();
                this.renderWorkspace();
            },

            deleteStockItem(medId) {
                if (confirm('هل أنت متأكد من حذف هذه المادة من سجل المخزون؟')) {
                    this.medications = this.medications.filter(m => m.id !== medId);
                    this.renderWorkspace();
                }
            },

            renderSupplierRequests() {
                const regionRequests = this.requestsQueue.filter(r => r.region === this.userMetadata.region);

                let cardsHtml = '';
                if (regionRequests.length === 0) {
                    cardsHtml = `<div class="card-container" style="text-align: center; padding: 40px; color: var(--text-muted);">لا توجد طلبيات واردة من الصيدليات في النطاق الجغرافي حالياً.</div>`;
                } else {
                    cardsHtml = regionRequests.map(req => {
                        let statusBadgeClass = 'status-pending';
                        let statusText = 'قيد الانتظار';
                        if (req.status === 'accepted') {
                            statusBadgeClass = 'status-accepted';
                            statusText = 'تم القبول والتجهيز';
                        } else if (req.status === 'rejected') {
                            statusBadgeClass = 'status-rejected';
                            statusText = 'مرفوض';
                        }

                        return `
                            <div class="request-card">
                                <div class="request-card-header">
                                    <div class="request-pharmacy-name">
                                        <i class="fa-solid fa-hospital-user" style="color: var(--imperial-red);"></i> ${req.pharmacyName}
                                    </div>
                                    <span class="status-badge ${statusBadgeClass}">${statusText}</span>
                                </div>
                                <div class="request-items-summary">
                                    <strong>المواد المطلوبة:</strong> ${req.itemsSummary}
                                </div>
                                <div class="request-card-footer">
                                    <div>
                                        <span style="font-size: 0.85rem; color: var(--text-muted);">صافي الفاتورة:</span>
                                        <strong style="color: var(--imperial-red); font-size: 1.1rem; margin-right: 8px;">${req.netCost.toLocaleString()} ل.س</strong>
                                    </div>
                                    <div>
                                        ${req.status === 'pending' ? `
                                            <button class="btn btn-success" style="padding: 8px 14px; font-size: 0.85rem; border-radius: 8px;" onclick="AppState.updateRequestStatus(${req.id}, 'accepted')">
                                                <i class="fa-solid fa-check"></i> قبول وتجهيز الشحنة
                                            </button>
                                            <button class="btn btn-secondary" style="padding: 8px 14px; font-size: 0.85rem; border-radius: 8px; color: var(--imperial-red);" onclick="AppState.updateRequestStatus(${req.id}, 'rejected')">
                                                <i class="fa-solid fa-xmark"></i> رفض
                                            </button>
                                        ` : `
                                            <span style="font-size: 0.85rem; color: var(--text-muted); font-style: italic;">تمت معالجة الطلبية</span>
                                        `}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                return `
                    <div class="card-container">
                        <div class="section-header-flex">
                            <h2 class="section-title"><i class="fa-solid fa-file-invoice-dollar"></i> قائمة الطلبات الواردة (${this.userMetadata.region})</h2>
                        </div>
                        <div>
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            },

            updateRequestStatus(reqId, newStatus) {
                const req = this.requestsQueue.find(r => r.id === reqId);
                if (req) {
                    req.status = newStatus;
                    this.renderWorkspace();
                }
            },

            // --- SHARED TABS: NETWORK ANALYTICS & ACCOUNT HUB ---
            renderSharedAnalytics() {
                const totalFinancialVolume = this.requestsQueue.filter(r => r.status === 'accepted').reduce((sum, r) => sum + r.netCost, 1450000);
                const activeSuppliersCount = new Set(this.medications.map(m => m.supplierName)).size;
                const totalOrdersCount = this.requestsQueue.length + 12;

                return `
                    <div>
                        <div class="analytics-grid">
                            <div class="metric-card">
                                <div class="metric-icon">
                                    <i class="fa-solid fa-wallet"></i>
                                </div>
                                <div class="metric-info">
                                    <span>إجمالي حجم المعاملات</span>
                                    <h3>${totalFinancialVolume.toLocaleString()} ل.س</h3>
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-icon">
                                    <i class="fa-solid fa-warehouse"></i>
                                </div>
                                <div class="metric-info">
                                    <span>مستودعات الشبكة النشطة</span>
                                    <h3>${activeSuppliersCount} مستودعات</h3>
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-icon">
                                    <i class="fa-solid fa-clipboard-list"></i>
                                </div>
                                <div class="metric-info">
                                    <span>إجمالي طلبيات المنصة</span>
                                    <h3>${totalOrdersCount} طلبية</h3>
                                </div>
                            </div>
                        </div>

                        <div class="card-container">
                            <h2 class="section-title" style="margin-bottom: 15px;"><i class="fa-solid fa-chart-pie"></i> تحليل وتوزيع الشبكة الطبية الإقليمية</h2>
                            <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6;">
                                تعمل منصة PharmaLink كحلقة وصل مركزية مؤمنة بالكامل تربط بين المستودعات الطبية الكبرى وصيادلة المجتمعات المحلية في مناطق (حلب، إدلب، ومنبج). تضمن خوارزميات التوجيه اللحظي مطابقة الأرصدة وسرعة تجهيز الشحنات وفق المعايير الطبية المعتمدة.
                            </p>
                        </div>
                    </div>
                `;
            },

            renderAccountHub() {
                const roleName = (this.userMetadata.role === 'pharmacist') ? 'صيدلاني / مشغل منشأة طبية' : 'صاحب مستودع توزيع معتمد';
                return `
                    <div class="card-container profile-card">
                        <div class="profile-avatar">
                            <i class="fa-solid fa-${this.userMetadata.role === 'pharmacist' ? 'mortar-pestle' : 'warehouse'}"></i>
                        </div>
                        <h2 style="font-size: 1.3rem; font-weight: 800; color: var(--text-main); margin-bottom: 5px;">${this.userMetadata.facilityName}</h2>
                        <p style="color: var(--imperial-red); font-weight: 700; font-size: 0.95rem; margin-bottom: 20px;">${roleName}</p>
                        
                        <div style="max-width: 400px; margin: 0 auto 30px auto; text-align: right; background: var(--clinical-tint); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border-color);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem;">
                                <span style="color: var(--text-muted);">مركز التوزيع:</span>
                                <strong>${this.userMetadata.region}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                                <span style="color: var(--text-muted);">حالة التوثيق الأمني:</span>
                                <strong style="color: var(--success-green);"><i class="fa-solid fa-shield-check"></i> مفعل ونشط</strong>
                            </div>
                        </div>

                        <div>
                            <button class="btn btn-secondary" style="background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; padding: 12px 30px; font-size: 0.95rem;" onclick="AppState.logout()">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج الآمن
                            </button>
                        </div>
                    </div>
                `;
            },

            logout() {
                if (confirm('هل أنت متأكد من رغبتك في تسجيل الخروج الآمن وإنهاء الجلسة؟')) {
                    // Flush state arrays & return to step 1 of gateway form
                    this.currentStep = 1;
                    this.userMetadata = { facilityName: '', password: '', region: 'حلب وريفها', role: 'pharmacist' };
                    this.cart = [];
                    this.searchQuery = '';
                    this.selectedCategoryFilter = 'الكل';

                    document.getElementById('credentials-wizard-form').reset();
                    document.getElementById('app-container').classList.remove('active');
                    document.getElementById('gateway-container').classList.remove('hidden');
                    this.updateWizardUI();
                }
            }
        };

        // Initialize state engine on window load
        window.onload = () => {
            AppState.init();
            AppState.updateWizardUI();
        };
    </script>
</body>

</html>
